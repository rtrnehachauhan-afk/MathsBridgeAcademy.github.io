{id:"a7i",src:"Ex 3A \u00b7 Q7(i)",diff:"m",q:"Expand: \\((6-2y+4z)^2\\)",given:null,formula:"\\((a+b+c)^2 = a^2 + b^2 + c^2 + 2(ab + bc + ca)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a = 6,\\ \\ b = -2y,\\ \\ c = 4z\\)</div>","<div class=\"line\">\\[= (6)^2 + (-2y)^2 + (4z)^2 + 2\\big[(6)(-2y) + (-2y)(4z) + (4z)(6)\\big]\\]</div>","<div class=\"line\">\\[= 36 + 4y^2 + 16z^2 + 2(-12y - 8yz + 24z)\\]</div>","<div class=\"line\">\\[= 36 + 4y^2 + 16z^2 - 24y - 16yz + 48z\\]</div>"],answer:"\\(36 + 4y^2 + 16z^2 - 24y - 16yz + 48z\\)",opts:null},

{id:"a11i",src:"Ex 3A \u00b7 Q11(i)",diff:"e",q:"Expand: \\((3a+2b)(3a-2b)\\)",given:null,formula:"\\((a + b)(a - b) = a^2 - b^2\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a = 3a,\\ \\ b = 2b\\)</div>","<div class=\"line\">\\[= (3a)^2 - (2b)^2\\]</div>","<div class=\"line\">\\[= 9a^2 - 4b^2\\]</div>"],answer:"\\(9a^2 - 4b^2\\)",opts:null},
{id:"a11ii",src:"Ex 3A \u00b7 Q11(ii)",diff:"e",q:"Expand: \\(\\left(5x+\\dfrac{1}{5x}\\right)\\left(5x-\\dfrac{1}{5x}\\right)\\)",given:null,formula:"\\(\\left(a-\\dfrac{1}{a}\\right)\\left(a+\\dfrac{1}{a}\\right) = a^2-\\dfrac{1}{a^2}\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=5x</div>","<div class=\"line\">\\[\\left(5x-\\dfrac{1}{5x}\\right)\\left(5x+\\dfrac{1}{5x}\\right) = (5x)^2-\\dfrac{1}{(5x)^2}\\]</div>","<div class=\"line\">\\[= 25x^2-\\dfrac{1}{25x^2}\\]</div>"],answer:"\\(25x^2 - \\dfrac{1}{25x^2}\\)",opts:null},
{id:"a11iii",src:"Ex 3A \u00b7 Q11(iii)",diff:"m",q:"Expand: \\(\\left(2x^2+\\dfrac{3}{x^2}\\right)\\left(2x^2-\\dfrac{3}{x^2}\\right)\\)",given:null,formula:"\\((a + b)(a - b) = a^2 - b^2\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a = 2x^2,\\ \\ b = \\dfrac{3}{x^2}\\)</div>","<div class=\"line\">\\[= (2x^2)^2 - \\left(\\dfrac{3}{x^2}\\right)^2\\]</div>","<div class=\"line\">\\[= 4x^4 - \\dfrac{9}{x^4}\\]</div>"],answer:"\\(4x^4 - \\dfrac{9}{x^4}\\)",opts:null},
{id:"a12i",src:"Ex 3A \u00b7 Q12(i)",diff:"m",q:"Expand: \\((2-x)(2+x)(4+x^2)\\)",given:null,formula:"\\((a + b)(a - b) = a^2 - b^2\\)",work:["<div class=\"line\">\\[= \\big[(2)^2 - (x)^2\\big](4 + x^2)\\]</div>","<div class=\"line\">\\[= (4 - x^2)(4 + x^2)\\]</div>","<div class=\"line\">\\[= (4)^2 - (x^2)^2\\]</div>","<div class=\"line\">\\[= 16 - x^4\\]</div>"],answer:"\\(16 - x^4\\)",opts:null},
{id:"a12ii",src:"Ex 3A \u00b7 Q12(ii)",diff:"m",q:"Expand: \\((x+y)(x-y)(x^2+y^2)\\)",given:null,formula:"\\((a + b)(a - b) = a^2 - b^2\\)",work:["<div class=\"line\">\\[= (x^2 - y^2)(x^2 + y^2)\\]</div>","<div class=\"line\">\\[= (x^2)^2 - (y^2)^2\\]</div>","<div class=\"line\">\\[= x^4 - y^4\\]</div>"],answer:"\\(x^4 - y^4\\)",opts:null},
{id:"a13i",src:"Ex 3A \u00b7 Q13(i)",diff:"m",q:"Expand: \\((x-2)(x-3)(x+4)\\)",given:null,formula:"\\(Multiply two brackets first, then the third.\\)",work:["<div class=\"line\">\\[= (x - 2)(x - 3)(x + 4)\\]</div>","<div class=\"line\">\\[= (x^2 - 5x + 6)(x + 4)\\]</div>","<div class=\"line\">\\[= x^3 + 4x^2 - 5x^2 - 20x + 6x + 24\\]</div>","<div class=\"line\">\\[= x^3 - x^2 - 14x + 24\\]</div>"],answer:"\\(x^3 - x^2 - 14x + 24\\)",opts:null},

{id:"a14i",src:"Ex 3A \u00b7 Q14(i)",diff:"m",q:"Simplify: \\((a+b)^2 + (a-b)^2\\)",given:null,formula:"\\((a+b)^2 + (a-b)^2 = 2(a^2 + b^2)\\)",work:["<div class=\"line\">\\[= (a^2 + 2ab + b^2) + (a^2 - 2ab + b^2)\\]</div>","<div class=\"line\">\\[= a^2 \\textcolor{red}{+\\cancel{2ab}} + b^2 + a^2 \\textcolor{red}{-\\cancel{2ab}} + b^2\\]</div>","<div class=\"line\">\\[= 2a^2 + 2b^2\\]</div>","<div class=\"line\">\\[= 2(a^2 + b^2)\\]</div>"],answer:"\\(2(a^2 + b^2)\\)",opts:null},

{id:"a14vi",src:"Ex 3A \u00b7 Q14(vi)",diff:"h",q:"Simplify: \\(\\left(3x-\\dfrac{1}{3x}\\right)^2 - \\left(3x+\\dfrac{1}{3x}\\right)\\left(3x-\\dfrac{1}{3x}\\right)\\)",given:null,formula:"\\(\\left(a-\\dfrac{1}{a}\\right)^2 = a^2+\\dfrac{1}{a^2}-2;\\ \\ \\left(a-\\dfrac{1}{a}\\right)\\left(a+\\dfrac{1}{a}\\right) = a^2-\\dfrac{1}{a^2}\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=3x</div>","<div class=\"line\">\\[\\left(3x-\\dfrac{1}{3x}\\right)^2 = 9x^2+\\dfrac{1}{9x^2}-2\\]</div>","<div class=\"line\">\\[\\left(3x+\\dfrac{1}{3x}\\right)\\left(3x-\\dfrac{1}{3x}\\right) = 9x^2-\\dfrac{1}{9x^2}\\]</div>","<div class=\"line\">\\[= \\left(9x^2 - 2 + \\dfrac{1}{9x^2}\\right) - \\left(9x^2 - \\dfrac{1}{9x^2}\\right)\\]</div>","<div class=\"line\">\\[= \\textcolor{red}{\\cancel{9x^2}} - 2 + \\dfrac{1}{9x^2} \\textcolor{red}{-\\cancel{9x^2}} + \\dfrac{1}{9x^2}\\]</div>","<div class=\"line\">\\[= \\dfrac{2}{9x^2} - 2\\]</div>"],answer:"\\(\\dfrac{2}{9x^2} - 2\\)",opts:null},

{id:"b1i",src:"Ex 3B \u00b7 Q1(i)",diff:"m",q:"Expand: \\((3a+5b)^3\\)",given:null,formula:"\\((a+b)^3 = a^3 + 3ab(a+b) + b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=3a,\\ \\ b=5b</div>","<div class=\"line\">\\[(3a+5b)^3 = (3a)^3 + 3(3a)(5b)(3a+5b) + (5b)^3\\]</div>","<div class=\"line\">\\[= 27a^3 + 45ab(3a+5b) + 125b^3\\]</div>","<div class=\"line\">\\[= 27a^3 + 135a^2 b + 225ab^2 + 125b^3\\]</div>"],answer:"\\(27a^3 + 135a^2 b + 225ab^2 + 125b^3\\)",opts:null},

{id:"b1iii",src:"Ex 3B \u00b7 Q1(iii)",diff:"h",q:"Expand: \\(\\left(2x+\\dfrac{1}{3x}\\right)^3\\)",given:null,formula:"\\((a+b)^3 = a^3 + 3ab(a+b) + b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=2x,\\ \\ b=\\dfrac{1}{3x}</div>","<div class=\"line\">\\[\\left(2x+\\dfrac{1}{3x}\\right)^3 = (2x)^3 + 3(2\\cancel{x})\\left(\\dfrac{1}{\\cancel{3}\\cancel{x}}\\right)\\left(2x+\\dfrac{1}{3x}\\right) + \\left(\\dfrac{1}{3x}\\right)^3\\]</div>","<div class=\"line\">\\[= 8x^3 + 2\\left(2x+\\dfrac{1}{3x}\\right) + \\dfrac{1}{27x^3}\\]</div>","<div class=\"line\">\\[= 8x^3 + 4x + \\dfrac{2}{3x} + \\dfrac{1}{27x^3}\\]</div>"],answer:"\\(8x^3 + 4x + \\dfrac{2}{3x} + \\dfrac{1}{27x^3}\\)",opts:null},
{id:"b1iv",src:"Ex 3B \u00b7 Q1(iv)",diff:"m",q:"Expand: \\((3ab-2c)^3\\)",given:null,formula:"\\((a-b)^3 = a^3 - 3ab(a-b) - b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=3ab,\\ \\ b=2c</div>","<div class=\"line\">\\[(3ab-2c)^3 = (3ab)^3 - 3(3ab)(2c)(3ab-2c) - (2c)^3\\]</div>","<div class=\"line\">\\[= 27a^3 b^3 - 18abc(3ab-2c) - 8c^3\\]</div>","<div class=\"line\">\\[= 27a^3 b^3 - 54a^2 b^2 c + 36abc^2 - 8c^3\\]</div>"],answer:"\\(27a^3 b^3 - 54a^2 b^2 c + 36abc^2 - 8c^3\\)",opts:null},
{id:"b1v",src:"Ex 3B \u00b7 Q1(v)",diff:"h",q:"Expand: \\(\\left(3a-\\dfrac{1}{a}\\right)^3\\)",given:null,formula:"\\((a-b)^3 = a^3 - 3ab(a-b) - b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=3a,\\ \\ b=\\dfrac{1}{a}</div>","<div class=\"line\">\\[\\left(3a-\\dfrac{1}{a}\\right)^3 = (3a)^3 - 3(3\\cancel{a})\\left(\\dfrac{1}{\\cancel{a}}\\right)\\left(3a-\\dfrac{1}{a}\\right) - \\left(\\dfrac{1}{a}\\right)^3\\]</div>","<div class=\"line\">\\[= 27a^3 - 9\\left(3a-\\dfrac{1}{a}\\right) - \\dfrac{1}{a^3}\\]</div>","<div class=\"line\">\\[= 27a^3 - 27a + \\dfrac{9}{a} - \\dfrac{1}{a^3}\\]</div>"],answer:"\\(27a^3 - 27a + \\dfrac{9}{a} - \\dfrac{1}{a^3}\\)",opts:null},
{id:"b1vi",src:"Ex 3B \u00b7 Q1(vi)",diff:"h",q:"Expand: \\(\\left(\\dfrac{x}{2}-\\dfrac{2y}{3}\\right)^3\\)",given:null,formula:"\\((a-b)^3 = a^3 - 3ab(a-b) - b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=\\dfrac{x}{2},\\ \\ b=\\dfrac{2y}{3}</div>","<div class=\"line\">\\[\\left(\\dfrac{x}{2}-\\dfrac{2y}{3}\\right)^3 = \\left(\\dfrac{x}{2}\\right)^3 - 3\\left(\\dfrac{x}{\\cancel{2}}\\right)\\left(\\dfrac{\\cancel{2}y}{\\cancel{3}}\\right)\\left(\\dfrac{x}{2}-\\dfrac{2y}{3}\\right) - \\left(\\dfrac{2y}{3}\\right)^3\\]</div>","<div class=\"line\">\\[= \\dfrac{x^3}{8} - xy\\left(\\dfrac{x}{2}-\\dfrac{2y}{3}\\right) - \\dfrac{8y^3}{27}\\]</div>","<div class=\"line\">\\[= \\dfrac{x^3}{8} - \\dfrac{x^2 y}{2} + \\dfrac{2xy^2}{3} - \\dfrac{8y^3}{27}\\]</div>"],answer:"\\(\\dfrac{x^3}{8} - \\dfrac{x^2 y}{2} + \\dfrac{2xy^2}{3} - \\dfrac{8y^3}{27}\\)",opts:null},
{id:"b2",src:"Ex 3B \u00b7 Q2",diff:"m",q:"If \\(4a+3b=10\\) and \\(ab=2\\), find \\(64a^3+27b^3\\).",given:"\\(4a+3b=10,\\quad ab=2\\)",formula:"\\(a^3+b^3 = (a+b)^3 - 3ab(a+b)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a = 4a,\\ \\ b = 3b</div>","<div class=\"line\">\\[(4a)^3+(3b)^3 = (4a+3b)^3 - 3(4a)(3b)(4a+3b)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">4a+3b=10,\\ \\ ab=2</div>","<div class=\"line\">\\[64a^3+27b^3 = (10)^3 - 36ab(10)\\]</div>","<div class=\"line\">\\[= 1000 - 36(2)(10)\\]</div>","<div class=\"line\">\\[= 1000 - 720 = 280\\]</div>"],answer:"\\(280\\)",opts:null},
{id:"b3",src:"Ex 3B \u00b7 Q3",diff:"m",q:"If \\(3x-2y=5\\) and \\(xy=6\\), find \\(27x^3-8y^3\\).",given:"\\(3x-2y=5,\\quad xy=6\\)",formula:"\\(a^3-b^3 = (a-b)^3 + 3ab(a-b)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a = 3x,\\ \\ b = 2y</div>","<div class=\"line\">\\[(3x)^3-(2y)^3 = (3x-2y)^3 + 3(3x)(2y)(3x-2y)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">3x-2y=5,\\ \\ xy=6</div>","<div class=\"line\">\\[27x^3-8y^3 = (5)^3 + 18xy(5)\\]</div>","<div class=\"line\">\\[= 125 + 18(6)(5)\\]</div>","<div class=\"line\">\\[= 125 + 540 = 665\\]</div>"],answer:"\\(665\\)",opts:null},
{id:"b4",src:"Ex 3B \u00b7 Q4",diff:"m",q:"If \\(a+3b=6\\), show that \\(a^3+27b^3+54ab=216\\).",given:"\\(a+3b=6\\)",formula:"\\((a+b)^3 = a^3 + 3ab(a+b) + b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=a,\\ \\ b=3b</div>","<div class=\"line\">\\[LHS = a^3+27b^3+54ab\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Start from the identity, using a+3b=6:</div>","<div class=\"line\">\\[(a+3b)^3 = a^3 + 3(a)(3b)(a+3b) + (3b)^3\\]</div>","<div class=\"line\">\\[(a+3b)^3 = a^3 + 9ab(a+3b) + 27b^3\\]</div>","<div class=\"line\">\\[(6)^3 = a^3 + 27b^3 + 9ab(6)\\]</div>","<div class=\"line\">\\[216 = a^3 + 27b^3 + 54ab\\]</div>","<div class=\"line\">\\[\\therefore\\ LHS = a^3+27b^3+54ab = 216 = RHS \\ \\ \\text{(Hence proved)}\\]</div>"],answer:"\\(\\text{Proved}\\)",opts:null},
{id:"b5",src:"Ex 3B \u00b7 Q5",diff:"m",q:"If \\(a+2b+3c=0\\), show that \\(a^3+8b^3+27c^3=18abc\\).",given:"\\(a+2b+3c=0\\)",formula:"\\(\\text{If } a+b+c=0,\\text{ then } a^3+b^3+c^3 = 3abc\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=a,\\ \\ b=2b,\\ \\ c=3c</div>","<div class=\"line\">\\[LHS = a^3+8b^3+27c^3\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Given: a+2b+3c=0, so the identity above applies directly:</div>","<div class=\"line\">\\[a^3 + (2b)^3 + (3c)^3 = 3(a)(2b)(3c)\\]</div>","<div class=\"line\">\\[a^3 + 8b^3 + 27c^3 = 18abc\\]</div>","<div class=\"line\">\\[\\therefore\\ LHS = a^3+8b^3+27c^3 = 18abc = RHS \\ \\ \\text{(Hence proved)}\\]</div>"],answer:"\\(\\text{Proved}\\)",opts:null},
{id:"b6",src:"Ex 3B \u00b7 Q6",diff:"m",q:"If \\(x+\\dfrac{1}{x}=3\\), find \\(x^3+\\dfrac{1}{x^3}\\).",given:"\\(x+\\dfrac{1}{x}=3\\)",formula:"\\(a^3+\\dfrac{1}{a^3} = \\left(a+\\dfrac{1}{a}\\right)^3 - 3\\left(a+\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(x+\\dfrac{1}{x}=3\\)</div>","<div class=\"line\">\\[= (3)^3 - 3(3)\\]</div>","<div class=\"line\">\\[= 27 - 9 = 18\\]</div>"],answer:"\\(18\\)",opts:null},
{id:"b7",src:"Ex 3B \u00b7 Q7",diff:"m",q:"If \\(x-\\dfrac{1}{x}=5\\), find \\(x^3-\\dfrac{1}{x^3}\\).",given:"\\(x-\\dfrac{1}{x}=5\\)",formula:"\\(a^3-\\dfrac{1}{a^3} = \\left(a-\\dfrac{1}{a}\\right)^3 + 3\\left(a-\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(x-\\dfrac{1}{x}=5\\)</div>","<div class=\"line\">\\[= (5)^3 + 3(5)\\]</div>","<div class=\"line\">\\[= 125 + 15 = 140\\]</div>"],answer:"\\(140\\)",opts:null},
{id:"b8",src:"Ex 3B \u00b7 Q8",diff:"m",q:"If \\(x-\\dfrac{2}{x}=6\\), find \\(x^3-\\dfrac{8}{x^3}\\).",given:"\\(x-\\dfrac{2}{x}=6\\)",formula:"\\((a-b)^3 = a^3 - 3ab(a-b) - b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=x,\\ \\ b=\\dfrac{2}{x}</div>","<div class=\"line\">\\[\\left(x-\\dfrac{2}{x}\\right)^3 = x^3 - 3(\\cancel{x})\\left(\\dfrac{2}{\\cancel{x}}\\right)\\left(x-\\dfrac{2}{x}\\right) - \\left(\\dfrac{2}{x}\\right)^3\\]</div>","<div class=\"line\">\\[\\left(x-\\dfrac{2}{x}\\right)^3 = x^3 - 6\\left(x-\\dfrac{2}{x}\\right) - \\dfrac{8}{x^3}\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Rearranging to isolate \\(x^3-\\dfrac{8}{x^3}\\):</div>","<div class=\"line\">\\[x^3-\\dfrac{8}{x^3} = \\left(x-\\dfrac{2}{x}\\right)^3 + 6\\left(x-\\dfrac{2}{x}\\right)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">x-\\dfrac{2}{x}=6</div>","<div class=\"line\">\\[= (6)^3 + 6(6)\\]</div>","<div class=\"line\">\\[= 216 + 36 = 252\\]</div>"],answer:"\\(252\\)",opts:null},
{id:"b9",src:"Ex 3B \u00b7 Q9",diff:"h",stem:"If \\(x+\\dfrac{1}{x}=4\\):",parts:[{label:"i",q:"find \\(x^3+\\dfrac{1}{x^3}\\).",given:null,formula:"\\(a^3+\\dfrac{1}{a^3} = \\left(a+\\dfrac{1}{a}\\right)^3 - 3\\left(a+\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\">\\[= (4)^3 - 3(4)\\]</div>","<div class=\"line\">\\[= 64 - 12 = 52\\]</div>"],answer:"\\(52\\)"},{label:"ii",q:"find \\(x-\\dfrac{1}{x}\\).",given:null,formula:"\\(\\left(a+\\dfrac{1}{a}\\right)^2-\\left(a-\\dfrac{1}{a}\\right)^2 = 4\\)",work:["<div class=\"line\">\\[\\left(x+\\dfrac{1}{x}\\right)^2-\\left(x-\\dfrac{1}{x}\\right)^2 = 4\\]</div>","<div class=\"line\">\\[(4)^2-\\left(x-\\dfrac{1}{x}\\right)^2 = 4\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Rearranging to isolate the unknown term:</div>","<div class=\"line\">\\[\\left(x-\\dfrac{1}{x}\\right)^2 = 16-4 = 12\\]</div>","<div class=\"line\">\\[\\therefore\\ x-\\dfrac{1}{x} = \\pm 2\\sqrt3\\]</div>"],answer:"\\(\\pm 2\\sqrt3\\)"},{label:"iii",q:"find \\(x^3-\\dfrac{1}{x^3}\\).",given:null,formula:"\\(a^3-\\dfrac{1}{a^3} = \\left(a-\\dfrac{1}{a}\\right)^3 + 3\\left(a-\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">From (ii): x-\\dfrac{1}{x} = \\pm 2\\sqrt3</div>","<div class=\"line\">\\[= (2\\sqrt3)^3 + 3(2\\sqrt3)\\]</div>","<div class=\"line\">\\[= 24\\sqrt3 + 6\\sqrt3 = \\pm 30\\sqrt3\\]</div>"],answer:"\\(\\pm 30\\sqrt3\\)"}]},
{id:"b10",src:"Ex 3B \u00b7 Q10",diff:"m",stem:"If \\(a^2+\\dfrac{1}{a^2}=23\\):",parts:[{label:"i",q:"find \\(a+\\dfrac{1}{a}\\).",given:null,formula:"\\(\\left(a+\\dfrac{1}{a}\\right)^2 = a^2+\\dfrac{1}{a^2} + 2\\)",work:["<div class=\"line\">\\[= 23 + 2 = 25\\]</div>","<div class=\"line\">\\[\\therefore\\ a+\\dfrac{1}{a} = \\pm 5\\]</div>"],answer:"\\(\\pm 5\\)"},{label:"ii",q:"find \\(a^3+\\dfrac{1}{a^3}\\).",given:null,formula:"\\(a^3+\\dfrac{1}{a^3} = \\left(a+\\dfrac{1}{a}\\right)^3 - 3\\left(a+\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">From (i): a+\\dfrac{1}{a} = \\pm 5</div>","<div class=\"line\">\\[= (5)^3 - 3(5)\\]</div>","<div class=\"line\">\\[= 125 - 15 = \\pm 110\\]</div>"],answer:"\\(\\pm 110\\)"}]},
{id:"b11",src:"Ex 3B \u00b7 Q11",diff:"m",stem:"If \\(a-\\dfrac{1}{a}=\\sqrt5\\):",parts:[{label:"i",q:"find \\(a+\\dfrac{1}{a}\\).",given:null,formula:"\\(\\left(a+\\dfrac{1}{a}\\right)^2-\\left(a-\\dfrac{1}{a}\\right)^2 = 4\\)",work:["<div class=\"line\">\\[\\left(a+\\dfrac{1}{a}\\right)^2-\\left(a-\\dfrac{1}{a}\\right)^2 = 4\\]</div>","<div class=\"line\">\\[\\left(a+\\dfrac{1}{a}\\right)^2-(\\sqrt5)^2 = 4\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Rearranging to isolate the unknown term:</div>","<div class=\"line\">\\[\\left(a+\\dfrac{1}{a}\\right)^2 = 4+5 = 9\\]</div>","<div class=\"line\">\\[\\therefore\\ a+\\dfrac{1}{a} = \\pm 3\\]</div>"],answer:"\\(\\pm 3\\)"},{label:"ii",q:"find \\(a^3+\\dfrac{1}{a^3}\\).",given:null,formula:"\\(a^3+\\dfrac{1}{a^3} = \\left(a+\\dfrac{1}{a}\\right)^3 - 3\\left(a+\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">From (i): a+\\dfrac{1}{a} = \\pm 3</div>","<div class=\"line\">\\[= (3)^3 - 3(3)\\]</div>","<div class=\"line\">\\[= 27 - 9 = \\pm 18\\]</div>"],answer:"\\(\\pm 18\\)"}]},
{id:"b12",src:"Ex 3B \u00b7 Q12",diff:"m",stem:"If \\(a^2+\\dfrac{1}{a^2}=27\\):",parts:[{label:"i",q:"find \\(a-\\dfrac{1}{a}\\).",given:null,formula:"\\(\\left(a-\\dfrac{1}{a}\\right)^2 = a^2+\\dfrac{1}{a^2} - 2\\)",work:["<div class=\"line\">\\[= 27 - 2 = 25\\]</div>","<div class=\"line\">\\[\\therefore\\ a-\\dfrac{1}{a} = \\pm 5\\]</div>"],answer:"\\(\\pm 5\\)"},{label:"ii",q:"find \\(a^3-\\dfrac{1}{a^3}\\).",given:null,formula:"\\(a^3-\\dfrac{1}{a^3} = \\left(a-\\dfrac{1}{a}\\right)^3 + 3\\left(a-\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">From (i): a-\\dfrac{1}{a} = \\pm 5</div>","<div class=\"line\">\\[= (5)^3 + 3(5)\\]</div>","<div class=\"line\">\\[= 125 + 15 = \\pm 140\\]</div>"],answer:"\\(\\pm 140\\)"}]},
{id:"b13",src:"Ex 3B \u00b7 Q13",diff:"h",stem:"If \\(x^2+\\dfrac{1}{25x^2}=8\\tfrac{3}{5}=\\dfrac{43}{5}\\):",parts:[{label:"i",q:"find \\(x+\\dfrac{1}{5x}\\).",given:null,formula:"\\((a+b)^2 = a^2+b^2+2ab\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=x,\\ \\ b=\\dfrac{1}{5x}</div>","<div class=\"line\">\\[\\left(x+\\dfrac{1}{5x}\\right)^2 = x^2+\\left(\\dfrac{1}{5x}\\right)^2+2(\\cancel{x})\\left(\\dfrac{1}{5\\cancel{x}}\\right)\\]</div>","<div class=\"line\">\\[\\left(x+\\dfrac{1}{5x}\\right)^2 = x^2+\\dfrac{1}{25x^2}+\\dfrac{2}{5}\\]</div>","<div class=\"line\">\\[= \\dfrac{43}{5}+\\dfrac{2}{5} = 9\\]</div>","<div class=\"line\">\\[\\therefore\\ x+\\dfrac{1}{5x} = \\pm 3\\]</div>"],answer:"\\(\\pm 3\\)"},{label:"ii",q:"find \\(x^3+\\dfrac{1}{125x^3}\\).",given:null,formula:"\\(a^3+b^3 = (a+b)^3 - 3ab(a+b)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">a=x,\\ \\ b=\\dfrac{1}{5x}</div>","<div class=\"line\">\\[x^3+\\dfrac{1}{125x^3} = \\left(x+\\dfrac{1}{5x}\\right)^3 - 3(\\cancel{x})\\left(\\dfrac{1}{5\\cancel{x}}\\right)\\left(x+\\dfrac{1}{5x}\\right)\\]</div>","<div class=\"line\">\\[x^3+\\dfrac{1}{125x^3} = \\left(x+\\dfrac{1}{5x}\\right)^3 - \\dfrac{3}{5}\\left(x+\\dfrac{1}{5x}\\right)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">From (i): x+\\dfrac{1}{5x} = \\pm 3</div>","<div class=\"line\">\\[= (3)^3 - \\dfrac{3}{5}(3)\\]</div>","<div class=\"line\">\\[= 27 - \\dfrac{9}{5} = \\pm\\dfrac{126}{5}\\]</div>"],answer:"\\(\\pm\\dfrac{126}{5}\\)"}]},
{id:"b14",src:"Ex 3B \u00b7 Q14",diff:"m",q:"If \\(\\left(x+\\dfrac{1}{x}\\right)^2=3\\), show that \\(x^3+\\dfrac{1}{x^3}=0\\).",given:"\\(\\left(x+\\dfrac{1}{x}\\right)^2=3\\)",formula:"\\(a^3+\\dfrac{1}{a^3} = \\left(a+\\dfrac{1}{a}\\right)^3 - 3\\left(a+\\dfrac{1}{a}\\right)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\left(x+\\dfrac{1}{x}\\right)^2=3</div>","<div class=\"line\">\\[x+\\dfrac{1}{x} = \\sqrt3\\]</div>","<div class=\"line\">\\[LHS = x^3+\\dfrac{1}{x^3}\\]</div>","<div class=\"line\">\\[= \\left(x+\\dfrac{1}{x}\\right)^3 - 3\\left(x+\\dfrac{1}{x}\\right)\\]</div>","<div class=\"line\">\\[= (\\sqrt3)^3 - 3(\\sqrt3)\\]</div>","<div class=\"line\">\\[= \\textcolor{red}{\\cancel{3\\sqrt3}} \\textcolor{red}{-\\cancel{3\\sqrt3}}\\]</div>","<div class=\"line\">\\[= 0 = RHS\\]</div>","<div class=\"line\">\\[\\therefore\\ LHS = RHS \\ \\ \\text{(Hence proved)}\\]</div>"],answer:"\\(\\text{Proved}\\)",opts:null},
{id:"b15",src:"Ex 3B \u00b7 Q15",diff:"h",q:"If \\(\\dfrac{a}{b}=\\dfrac{b}{c}\\), prove \\((a+b+c)(a-b+c)=a^2+b^2+c^2\\).",given:"\\(\\dfrac{a}{b}=\\dfrac{b}{c}\\)",formula:"\\(a^2-b^2 = (a-b)(a+b)\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\dfrac{a}{b}=\\dfrac{b}{c}\\ \\Rightarrow\\ b^2=ac \\ \\ \\text{(cross-multiplying)}</div>","<div class=\"line\">\\[LHS = (a+b+c)(a-b+c)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Group as \\([(a+c)+b][(a+c)-b]\\), matching the identity above with \\((a+c)\\) and \\(b\\):</div>","<div class=\"line\">\\[= (a+c)^2 - b^2\\]</div>","<div class=\"line\">\\[= a^2+2ac+c^2 - b^2\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Substitute ac = b^2:</div>","<div class=\"line\">\\[= a^2+\\textcolor{green}{2b^2}+c^2 \\textcolor{green}{- b^2}\\]</div>","<div class=\"line\">\\[= a^2+b^2+c^2\\]</div>","<div class=\"line\">\\[= RHS\\]</div>","<div class=\"line\">\\[\\therefore\\ LHS = RHS \\ \\ \\text{(Hence proved)}\\]</div>"],answer:"\\(\\text{Proved}\\)",opts:null},
{id:"b16i",src:"Ex 3B \u00b7 Q16(i)",diff:"m",q:"Find the product: \\((3a+4b)(9a^2-12ab+16b^2)\\)",given:null,formula:"\\((a+b)(a^2 - ab + b^2) = a^3 + b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a=3a,\\ \\ b=4b\\)</div>","<div class=\"line\">\\[= (3a)^3 + (4b)^3\\]</div>","<div class=\"line\">\\[= 27a^3 + 64b^3\\]</div>"],answer:"\\(27a^3 + 64b^3\\)",opts:null},
{id:"b16ii",src:"Ex 3B \u00b7 Q16(ii)",diff:"m",q:"Find the product: \\(\\left(y-\\dfrac{6}{y}\\right)\\left(y^2+6+\\dfrac{36}{y^2}\\right)\\)",given:null,formula:"\\((a-b)(a^2 + ab + b^2) = a^3 - b^3\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a=y,\\ \\ b=\\dfrac{6}{y}\\)</div>","<div class=\"line\">\\[= (y)^3 - \\left(\\dfrac{6}{y}\\right)^3\\]</div>","<div class=\"line\">\\[= y^3 - \\dfrac{216}{y^3}\\]</div>"],answer:"\\(y^3 - \\dfrac{216}{y^3}\\)",opts:null},
{id:"b17",src:"Ex 3B \u00b7 Q17",diff:"h",q:"Simplify: \\((3x-5y-4)(9x^2+25y^2+16+15xy-20y+12x)\\)",given:null,formula:"\\((a+b+c)(a^2+b^2+c^2-ab-bc-ca) = a^3+b^3+c^3-3abc\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">\\(a=3x,\\ \\ b=-5y,\\ \\ c=-4\\)</div>","<div class=\"line\">\\[= (3x)^3 + (-5y)^3 + (-4)^3 - 3(3x)(-5y)(-4)\\]</div>","<div class=\"line\">\\[= 27x^3 - 125y^3 - 64 - 180xy\\]</div>"],answer:"\\(27x^3 - 125y^3 - 64 - 180xy\\)",opts:null},
];

{id:"c3",src:"Ex 3C \u00b7 Q3",diff:"e",q:"Write the product: \\((x-5)(x-7)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\">\\[= x^2 + [(-5)+(-7)]x + (-5)(-7)\\]</div>","<div class=\"line\">\\[= x^2 + (-12)x + (35)\\]</div>","<div class=\"line\">\\[= x^2 - 12x + 35\\]</div>"],answer:"\\(x^2 - 12x + 35\\)",opts:null},

{id:"c5",src:"Ex 3C \u00b7 Q5",diff:"e",q:"Write the product: \\((y-7)(y+4)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\">\\[= y^2 + [(-7)+4]x + (-7)(4)\\]</div>","<div class=\"line\">\\[= y^2 + (-3)y + (-28)\\]</div>","<div class=\"line\">\\[= y^2 - 3y - 28\\]</div>"],answer:"\\(y^2 - 3y - 28\\)",opts:null},
{id:"c6",src:"Ex 3C \u00b7 Q6",diff:"e",q:"Write the product: \\((ab+3)(ab-2)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Treat \\(ab\\) as the \"x\" of the identity:</div>","<div class=\"line\">\\[= (ab)^2 + [3+(-2)](ab) + (3)(-2)\\]</div>","<div class=\"line\">\\[= a^2b^2 + (1)(ab) + (-6)\\]</div>","<div class=\"line\">\\[= a^2 b^2 + ab - 6\\]</div>"],answer:"\\(a^2 b^2 + ab - 6\\)",opts:null},
{id:"c7",src:"Ex 3C \u00b7 Q7",diff:"e",q:"Write the product: \\((5-xy)(2+xy)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\">\\[(5-xy) = -xy+5 = -(xy-5)\\]</div>","<div class=\"line\">\\[(5-xy)(2+xy) = -(xy-5)(xy+2)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Now apply the identity with \\(a=-5,\\ b=2\\), treating \\(xy\\) as the \"x\":</div>","<div class=\"line\">\\[(xy-5)(xy+2) = (xy)^2 + [(-5)+2](xy) + (-5)(2)\\]</div>","<div class=\"line\">\\[= x^2y^2 + (-3)(xy) + (-10)\\]</div>","<div class=\"line\">\\[= x^2y^2 - 3xy - 10\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Multiply back by the \\(-1\\) that was pulled out:</div>","<div class=\"line\">\\[-(x^2y^2 - 3xy - 10) = 10 + 3xy - x^2y^2\\]</div>"],answer:"\\(10 + 3xy - x^2 y^2\\)",opts:null},
{id:"c8",src:"Ex 3C \u00b7 Q8",diff:"e",q:"Write the product: \\((x^2+1)(x^2+2)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Treat \\(x^2\\) as the \"x\" of the identity:</div>","<div class=\"line\">\\[= (x^2)^2 + [1+2](x^2) + (1)(2)\\]</div>","<div class=\"line\">\\[= x^4 + (3)(x^2) + (2)\\]</div>","<div class=\"line\">\\[= x^4 + 3x^2 + 2\\]</div>"],answer:"\\(x^4 + 3x^2 + 2\\)",opts:null},
{id:"c9",src:"Ex 3C \u00b7 Q9",diff:"e",q:"Write the product: \\((3-x^2)(5+x^2)\\)",given:null,formula:"\\((x + a)(x + b) = x^2 + (a + b)x + ab\\)",work:["<div class=\"line\">\\[(3-x^2) = -x^2+3 = -(x^2-3)\\]</div>","<div class=\"line\">\\[(3-x^2)(5+x^2) = -(x^2-3)(x^2+5)\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Now apply the identity with \\(a=-3,\\ b=5\\):</div>","<div class=\"line\">\\[(x^2-3)(x^2+5) = (x^2)^2 + [(-3)+5](x^2) + (-3)(5)\\]</div>","<div class=\"line\">\\[= x^4 + (2)(x^2) + (-15)\\]</div>","<div class=\"line\">\\[= x^4 + 2x^2 - 15\\]</div>","<div class=\"line\" style=\"color:#9a8f78;font-style:italic;font-size:13.5px\">Multiply back by the \\(-1\\) that was pulled out:</div>","<div class=\"line\">\\[-(x^4 + 2x^2 - 15) = 15 - 2x^2 - x^4\\]</div>"],answer:"\\(15 - 2x^2 - x^4\\)",opts:null},

/* ============ FORMULAE — accordion data ============ */

  '\\((a-b)^2 = a^2+b^2-2ab\\)',
  '\\(a^2-b^2 = (a-b)(a+b)\\)',
  '\\((a+b)^2-(a-b)^2 = 4ab\\)',
  '\\((a+b)^2+(a-b)^2 = 2(a^2+b^2)\\)'],
  note:'These five identities are the foundation for every "evaluate a²+b²" or "find a−b" style question in Ex 3A.'},

{h:'Reciprocal Square Identities', lines:[
  '\\(\\left(a+\\dfrac{1}{a}\\right)^2 = a^2+\\dfrac{1}{a^2}+2\\)',
  '\\(\\left(a-\\dfrac{1}{a}\\right)^2 = a^2+\\dfrac{1}{a^2}-2\\)',
  '\\(\\left(a-\\dfrac{1}{a}\\right)\\left(a+\\dfrac{1}{a}\\right) = a^2-\\dfrac{1}{a^2}\\)',
  '\\(\\left(a+\\dfrac{1}{a}\\right)^2-\\left(a-\\dfrac{1}{a}\\right)^2 = 4\\)',
  '\\(\\left(a+\\dfrac{1}{a}\\right)^2+\\left(a-\\dfrac{1}{a}\\right)^2 = 2\\left(a^2+\\dfrac{1}{a^2}\\right)\\)'],
  note:'Used whenever a question gives x+1/x or x−1/x and asks for x²+1/x², x−1/x, or similar.'},

  '\\((a+b)^3 = a^3+3ab(a+b)+b^3\\)',
  '\\(a^3+b^3 = (a+b)^3-3ab(a+b)\\)',
  '\\((a-b)^3 = a^3-3ab(a-b)-b^3\\)',
  '\\(a^3-b^3 = (a-b)^3+3ab(a-b)\\)'],
  note:'Core identities for Ex 3B — expanding cubes and finding a³+b³ / a³−b³ from a+b or a−b.'},

{h:'Reciprocal Cube Identities', lines:[

const SECTIONS = [
  {id:'ex3a', label:'Exercise 3A', data:QDATA_EX3A},
  {id:'ex3b', label:'Exercise 3B', data:QDATA_EX3B},
  {id:'ex3c', label:'Exercise 3C', data:QDATA_EX3C},
  {id:'mcq',  label:'MCQ',         data:QDATA_MCQ},
  {id:'ar',   label:'Assertion-Reasoning', data:QDATA_AR},
  {id:'comp', label:'Competency',  data:QDATA_COMP}
];
const DIFF = {e:['b-easy','Easy'], m:['b-med','Medium'], h:['b-hard','Hard']};
const REPORT_META = { board:'ICSE', grade:'9', chapter:'Expansions' };
const REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx3vGZZjTHbAnKtOwSz6TaWtpYtnudCzxKMtm3Eo9bB4Ey6Xlor6LunLFEmyIQQy5e6/exec';

function workRows(arr){
  let h = '';
  (arr||[]).forEach(function(l){ h += l; });
  return h;
}

function solBody(q){
  let h = '';
  if(q.given){
    h += '<div class="sol-given"><div class="sol-h">Given</div><div class="g">'+q.given+'</div></div>';
  }
  if(q.formula){
    h += '<div class="sol-formula"><div class="sol-h">Formula</div><div class="fml">'+q.formula+'</div></div>';
  }
  if(q.work && q.work.length){
    h += '<div class="sol-work"><div class="sol-h">Working</div>'+workRows(q.work)+'</div>';
  }
  if(q.answer){
    h += '<div class="sol-answer"><div class="sol-h">Answer</div><div class="a">'+q.answer+'</div></div>';
  }
  return h;
}

function cardHTML(q, no, isAR){
  const d = DIFF[q.diff] || DIFF.m;
  const cls = isAR ? 'q-ar' : 'q-sa';
  let h = '<div class="qcard '+cls+'" data-diff="'+d[1]+'" data-no="'+no+'">'
        + '<div class="qcard-stripe"></div><div class="qcard-body">';
  h += '<div class="badge-row">'
     + '<span class="badge b-src">'+q.src+'</span>'
     + '<span class="badge '+d[0]+'">'+d[1]+'</span>'
     + '<span class="qno">Q'+no+'</span>'
     + '</div>';

  if(q.parts){
    h += '<div class="qt">'+q.stem+'</div>';
    q.parts.forEach(function(p){
      h += '<div class="qt-part"><b>('+p.label+')</b> '+p.q+'</div>';
    });
    h += '<button class="sol-toggle">Show Solution</button>';
    h += '<button class="rep-btn">Report Error</button>';
    let inner = '';
    q.parts.forEach(function(p){
      inner += '<div class="sol-h" style="color:#0D2B4E;margin-top:10px">Part ('+p.label+')</div>' + solBody(p);
    });
    h += '<div class="sol-box">'+inner+'</div>';
    h += '</div></div>';
    return h;
  }

  if(isAR){
    h += '<div class="ar-stem">'+q.q+'</div>';
  } else {
    h += '<div class="qt">'+q.q+'</div>';
  }

  if(q.opts){
    h += '<ul class="mcq-opts">';
    q.opts.forEach(function(o,i){
      h += '<li class="mopt" data-i="'+i+'" data-correct="'+(o.correct?'1':'0')+'"><span class="lab">('+'abcd'[i]+')</span><span>'+o.text+'</span></li>';
    });
    h += '</ul>';
  }

  h += '<button class="sol-toggle">Show Solution</button>';
  h += '<button class="rep-btn">Report Error</button>';
  h += '<div class="sol-box">'+solBody(q)+'</div>';
  h += '</div></div>';
  return h;
}

function formulaeHTML(){
  let h = '';
  FORMULAE.forEach(function(f){
    h += '<div class="formula-card"><div class="formula-header">'+f.h+'<span class="arrow">+</span></div>'
       + '<div class="formula-body"><div class="fml">'+f.lines.join('<br>')+'</div>'
       + (f.note ? '<div class="note">'+f.note+'</div>' : '')
       + '</div></div>';
  });
  return h;
}

function render(){
  const ctabs = document.getElementById('ctabs');
  const holder = document.getElementById('sections');
  ctabs.innerHTML = '';
  holder.innerHTML = '';

  SECTIONS.forEach(function(s, si){
    const b = document.createElement('button');
    b.className = 'ctab' + (si===0 ? ' active' : '');
    b.textContent = s.label;
    b.setAttribute('data-c', s.id);
    ctabs.appendChild(b);

    const panel = document.createElement('div');
    panel.className = 'cpanel' + (si===0 ? ' active' : '');
    panel.id = s.id;

    const isAR = (s.id === 'ar');
    const list = s.data || [];
    let body = '<div class="filter-bar"><span class="fl">Difficulty</span>'
      + ['all','Easy','Medium','Hard'].map(function(f,fi){
          return '<button class="filter-btn'+(fi===0?' active':'')+'" data-t="'+s.id+'" data-f="'+f+'">'
               + (f==='all'?'All':f) + '</button>';
        }).join('') + '</div>';
    list.forEach(function(q, i){ body += cardHTML(q, i+1, isAR); });
    panel.innerHTML = body;
    holder.appendChild(panel);
  });

  const fpanel = document.createElement('div');
  fpanel.className = 'cpanel';
  fpanel.id = 'formulae';
  fpanel.innerHTML = formulaeHTML();
  const fbtn = document.createElement('button');
  fbtn.className = 'ctab';
  fbtn.textContent = 'Formulae';
  fbtn.setAttribute('data-c', 'formulae');
  ctabs.appendChild(fbtn);
  holder.appendChild(fpanel);

  wire();
  if(window.renderMathInElement){
    renderMathInElement(document.body,{delimiters:[{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false});
  }
}

function wire(){
  document.querySelectorAll('.ctab').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.ctab').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelectorAll('.cpanel').forEach(function(p){p.classList.remove('active');});
      document.getElementById(b.getAttribute('data-c')).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  document.querySelectorAll('.filter-btn').forEach(function(b){
    b.onclick = function(){
      const t = b.getAttribute('data-t'), f = b.getAttribute('data-f');
      document.querySelectorAll('.filter-btn[data-t="'+t+'"]').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelectorAll('#'+t+' .qcard').forEach(function(card){
        card.style.display = (f==='all' || card.getAttribute('data-diff')===f) ? 'flex' : 'none';
      });
    };
  });
  document.querySelectorAll('.sol-toggle').forEach(function(b){
    b.onclick = function(){
      const box = b.parentNode.querySelector('.sol-box');
      box.classList.toggle('open');
      b.textContent = box.classList.contains('open') ? 'Hide Solution' : 'Show Solution';
    };
  });
  document.querySelectorAll('.mcq-opts').forEach(function(ul){
    ul.querySelectorAll('.mopt').forEach(function(li){
      li.onclick = function(){
        if(li.classList.contains('locked')) return;
        ul.querySelectorAll('.mopt').forEach(function(x){
          x.classList.add('locked');
          if(x.getAttribute('data-correct')==='1') x.classList.add('correct');
        });
        if(li.getAttribute('data-correct')!=='1') li.classList.add('wrong');
      };
    });
  });
  document.querySelectorAll('.rep-btn').forEach(function(b){
    b.onclick = function(){
      const card = b.closest('.qcard');
      const cp = card.closest('.cpanel');
      openReport({ tab: (cp ? cp.id.toUpperCase() : ''), qno: card.getAttribute('data-no') });
    };
  });
  document.querySelectorAll('.formula-header').forEach(function(hd){
    hd.onclick = function(){
      const body = hd.nextElementSibling;
      body.classList.toggle('open');
      hd.querySelector('.arrow').textContent = body.classList.contains('open') ? '–' : '+';
    };
  });
  document.getElementById('repCancel').onclick = function(){
    document.getElementById('repMask').classList.remove('open');
  };
  document.getElementById('repSend').onclick = sendReport;
}

let REP_CTX = {};
function openReport(ctx){
  REP_CTX = ctx;
  document.getElementById('repMeta').textContent =
    REPORT_META.board + ' · Class ' + REPORT_META.grade + ' · ' + REPORT_META.chapter
    + ' · ' + ctx.tab + ' · Q' + ctx.qno;
  document.getElementById('repText').value = '';
  document.getElementById('repMsg').textContent = '';
  document.getElementById('repMask').classList.add('open');
}
function sendReport(){
  const txt = document.getElementById('repText').value.trim();
  if(!txt){ document.getElementById('repMsg').textContent = 'Please describe the error.'; return; }
  const p = new URLSearchParams({
    board: REPORT_META.board, grade: REPORT_META.grade, chapter: REPORT_META.chapter,
    tab: REP_CTX.tab, qno: REP_CTX.qno, error: txt
  });
  function done(){ document.getElementById('repMsg').textContent = 'Sent. Thank you!'; }
  fetch(REPORT_ENDPOINT + '?' + p.toString(), {method:'GET', mode:'no-cors'})
    .then(done).catch(done);
  setTimeout(function(){ document.getElementById('repMask').classList.remove('open'); }, 900);
}

render();

</script>
