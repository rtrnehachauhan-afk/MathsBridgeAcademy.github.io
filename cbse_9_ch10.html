<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quadrilateral Constructions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Crimson+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F5F0E8; --card:#FFFDF8; --border:#E2D9C6;
    --green-dk:#1A3D28; --green:#2D5A3D;
    --gold-dk:#C9A84C; --gold:#E8C56A;
    --purple-dk:#7B5EA7; --purple:#A07BD4;
    --navy-dk:#1A3050; --navy:#123A6B;
    --ink:#1A3050; --line:#1A3050;
    --arc:#123A6B; --accent:#7B5EA7;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Crimson Pro',Georgia,serif; background:var(--page); color:var(--navy-dk); padding:16px;}
  .kicker{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--green);
    background:rgba(26,61,40,.08); border:1px solid var(--green); border-radius:999px;
    display:inline-block; padding:4px 12px; margin-bottom:10px;
  }
  h1{font-family:'Playfair Display',Georgia,serif; font-weight:800; font-size:1.5rem; margin:0 0 6px; color:var(--green-dk);}
  .sub{font-family:'Crimson Pro',serif; color:#5b6b73; font-size:1rem; margin-bottom:16px;}
  .layout{display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; justify-content:center;}
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; box-shadow:0 2px 8px rgba(26,48,80,.06); flex:1 1 340px; max-width:400px;
  }
  select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:600;
    margin-bottom:14px; background:#fff; color:var(--navy-dk);
  }
  select:disabled{opacity:.5;}
  .steps-box{
    background:rgba(201,168,76,.08); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:16px;
  }
  .steps-box-title{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.72rem; color:var(--green);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  #stepTextWrap{
    font-family:'Crimson Pro',serif; font-size:1.08rem; line-height:1.6; color:var(--navy-dk);
    font-weight:600; min-height:2.6em; transition:opacity .25s ease, transform .25s ease;
  }
  #stepTextNum{font-family:'JetBrains Mono',monospace; color:var(--gold-dk); font-weight:700;}
  #stepTextWrap.fading{opacity:0; transform:translateY(6px);}
  .controls{display:flex; gap:10px; margin-top:4px;}
  button{
    flex:1; padding:11px 14px; border-radius:8px; border:1px solid var(--border);
    background:#fff; font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:700;
    letter-spacing:.02em; cursor:pointer; color:var(--navy-dk);
  }
  button.primary{background:linear-gradient(135deg,var(--green-dk),var(--green)); color:#fff; border-color:var(--green-dk);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .progress{display:flex; gap:6px; margin-top:14px;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--border); cursor:pointer;}
  .dot.active{background:var(--gold-dk);}
  svg{background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 2px 8px rgba(26,48,80,.06); width:100%; max-width:340px; height:auto; display:block; margin:0 auto;}
  @media (max-width:480px){ body{padding:10px;} .panel{max-width:100%;} svg{max-width:280px;} }
  .lbl{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; fill:var(--navy-dk);}
  .measure{font-family:'JetBrains Mono',monospace; font-size:12px; fill:var(--navy-dk); font-weight:600;}
  .final-note{
    margin-top:14px; font-family:'Crimson Pro',serif; font-size:.95rem;
    background:rgba(26,61,40,.08); border:1px solid var(--green); padding:10px 12px;
    border-radius:10px; color:var(--green-dk);
  }

  /* ---------- Draggable Scratchpad ---------- */
  #scratchToggle{
    position:fixed; right:20px; bottom:20px; z-index:9999;
    width:56px; height:56px; border-radius:50%;
    background:var(--green-dk); color:#fff; border:2px solid var(--gold-dk);
    font-size:1.35rem; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  #scratchToggle:hover{ background:var(--green); transform:scale(1.06); }
  #scratchToggle:active{ transform:scale(.96); }

  #scratchPad{
    position:fixed; right:20px; bottom:88px; z-index:9998;
    width:340px; height:280px;
    min-width:260px; min-height:200px; max-width:920px; max-height:720px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
    display:none; flex-direction:column; overflow:hidden;
    resize:both; box-sizing:border-box;
  }
  #scratchPad.open{ display:flex; }

  #scratchHeader{
    background:var(--green-dk); color:#fff; padding:8px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:.74rem; font-weight:600;
    letter-spacing:.03em; cursor:move; flex:none; user-select:none;
    border-bottom:2px solid var(--gold-dk);
  }
  #scratchTitle{ display:flex; align-items:center; gap:6px; text-transform:uppercase; }
  #scratchTools{ display:flex; gap:4px; }
  .stool{
    background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff;
    border-radius:6px; padding:3px 7px; font-size:.7rem; cursor:pointer;
    font-family:'JetBrains Mono',monospace; line-height:1.4; white-space:nowrap;
  }
  .stool:hover{ background:rgba(255,255,255,.18); }
  .stool.active{ background:var(--gold-dk); color:var(--green-dk); border-color:var(--gold-dk); font-weight:700; }
  .stool.active:hover{ background:var(--gold); }

  #scratchCanvas{
    flex:1 1 auto; width:100%; height:100%; display:block;
    touch-action:none; cursor:crosshair; background:var(--card);
  }
</style>
</head>

/* ---------- low-level reveal helpers (instant-trigger, no scheduled delay) ---------- */
function revealArc(el, duration){
  duration = duration || 650;
  if(!el) return;
  let len; try{ len = el.getTotalLength(); } catch(e){ len = 200; }
  el.style.transition = 'none';
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
  el.getBoundingClientRect();
  el.style.transition = 'stroke-dashoffset ' + duration + 'ms ease-in-out';
  requestAnimationFrame(()=>{ el.style.strokeDashoffset = 0; });
  // after the reveal finishes, drop the inline dasharray override so any native
  // dashed pattern (e.g. the "3 3" sketch-style arcs) is restored, not left solid
  setTimeout(()=>{ el.style.strokeDasharray=''; el.style.strokeDashoffset=''; }, duration + 40);
}
function revealFade(el, duration){
  duration = duration || 350;
  if(!el) return;
  el.style.transition = 'none';
  el.style.opacity = 0;
  el.getBoundingClientRect();
  el.style.transition = 'opacity ' + duration + 'ms ease-in';
  requestAnimationFrame(()=>{ el.style.opacity = 1; });
}
function fadeOut(el, duration){
  duration = duration || 400;
  if(!el) return;
  el.style.transition = 'none';
  el.style.opacity = 1;
  el.getBoundingClientRect();
  el.style.transition = 'opacity ' + duration + 'ms ease-out';
  requestAnimationFrame(()=>{ el.style.opacity = 0; });
}
function animateCompass(path){
  if(!path) return;
  const cx = parseFloat(path.dataset.cx), cy = parseFloat(path.dataset.cy);
  const genClass = 'gen-' + path.id;
  path.parentNode.querySelectorAll('.' + genClass).forEach(el => el.remove());

  const len = path.getTotalLength();
  const svgNS = "http://www.w3.org/2000/svg";
  const parent = path.parentNode;

  const pivot = document.createElementNS(svgNS, "circle");
  pivot.setAttribute("cx", cx); pivot.setAttribute("cy", cy); pivot.setAttribute("r", 5.5);
  pivot.setAttribute("fill", "#2563eb"); pivot.setAttribute("stroke", "#fff"); pivot.setAttribute("stroke-width", "1.5");
  pivot.classList.add(genClass);
  pivot.style.opacity = 0; pivot.style.transition = "opacity .2s";
  parent.appendChild(pivot);

  const arm = document.createElementNS(svgNS, "line");
  arm.setAttribute("stroke", "#94a3b8"); arm.setAttribute("stroke-width", "1.5");
  arm.classList.add(genClass);
  arm.style.opacity = 0; arm.style.transition = "opacity .2s";
  parent.appendChild(arm);

  const pencil = document.createElementNS(svgNS, "circle");
  pencil.setAttribute("r", 5); pencil.setAttribute("fill", "#f59e0b");
  pencil.setAttribute("stroke", "#fff"); pencil.setAttribute("stroke-width", "1.5");
  pencil.classList.add(genClass);
  pencil.style.opacity = 0; pencil.style.transition = "opacity .2s";
  parent.appendChild(pencil);

  requestAnimationFrame(()=>{ pivot.style.opacity = 1; arm.style.opacity = 1; pencil.style.opacity = 1; });

  const duration = 1000;
  const start = performance.now();
  function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t; }
  function frame(now){
    const raw = Math.min((now - start) / duration, 1);
    const eased = easeInOutQuad(raw);
    // sample the ACTUAL rendered path — guarantees the pencil dot always
    // follows the real drawn curve, regardless of sweep direction or span
    const pt = path.getPointAtLength(eased * len);
    arm.setAttribute("x1", cx); arm.setAttribute("y1", cy);
    arm.setAttribute("x2", pt.x); arm.setAttribute("y2", pt.y);
    pencil.setAttribute("cx", pt.x); pencil.setAttribute("cy", pt.y);
    if (raw < 1){ requestAnimationFrame(frame); }
    else {
      setTimeout(()=>{
        arm.style.opacity = 0;
        pencil.style.opacity = 0;
        pivot.style.opacity = 0.55;
      }, 350);
    }
  }
  requestAnimationFrame(frame);
}
function revealArcC(el, duration){ revealArc(el, duration); animateCompass(el); }

function el(id){ return document.getElementById(id); }

/* ---------- generic "whole group at once" action, for simple one-shot steps ---------- */
function drawGroupAction(gid){
  const g = el(gid);
  g.style.transition = 'none';
  g.style.opacity = 1;
  const strokes = g.querySelectorAll('line, path');
  strokes.forEach(p=> revealArc(p, 850));
  const others = g.querySelectorAll('circle, text, rect, polygon');
  others.forEach(o=>{
    o.style.transition = 'none'; o.style.opacity = 0; o.getBoundingClientRect();
    o.style.transition = 'opacity .5s ease-in';
  });
  setTimeout(()=>{ others.forEach(o=> o.style.opacity = 1); }, 750);
  g.querySelectorAll('.compass-arc').forEach(p => animateCompass(p));
}

/* ---------- instant (non-animated) state application, used for Back / dot jumps ---------- */
function instantShowElement(node){
  node.style.transition = 'none';
  if(node.tagName === 'path' || node.tagName === 'line' || node.classList.contains('drawn-circle')){
    node.style.strokeDasharray = '';
    node.style.strokeDashoffset = '';
  } else {
    node.style.opacity = 1;
  }
}
function instantHideGroup(gid){
  const g = el(gid);
  g.style.transition = 'none';
  g.style.opacity = 0;
}
function instantHideElement(node){
  node.style.transition = 'none';
  if(node.tagName === 'path' || node.tagName === 'line' || node.classList.contains('drawn-circle')){
    let len; try{ len = node.getTotalLength(); } catch(e){ len = 300; }
    node.style.strokeDasharray = len;
    node.style.strokeDashoffset = len;
  } else {
    node.style.opacity = 0;
  }
}

    arr.forEach(a => flat.push({ mainIdx, ms:a.ms, fn:a.fn, ids:a.ids }));
  });
  return flat;
}

function lockControls(ms){
  animating = true;
  el("nextBtn").disabled = true;
  el("prevBtn").disabled = true;
  el("qPicker").disabled = true;
  document.querySelectorAll('.dot').forEach(d=> d.style.pointerEvents = 'none');
  setTimeout(()=>{
    animating = false;
    el("prevBtn").disabled = microPos <= 0;
    el("nextBtn").disabled = microPos >= flatMicro.length - 1;
    el("qPicker").disabled = false;
    document.querySelectorAll('.dot').forEach(d=> d.style.pointerEvents = 'auto');
  }, ms);
}

function updateUI(textChanged){
  const q = QUESTIONS[currentQ];
  const mi = flatMicro[microPos].mainIdx;

  if(textChanged){
    const wrap = el("stepTextWrap");
    wrap.classList.add("fading");
    setTimeout(()=>{
      el("stepTextNum").textContent = (mi+1) + ".";
      el("stepTextBody").textContent = q.stepLines[mi];
      wrap.classList.remove("fading");
    }, 220);
  }

  const isFinal = microPos === flatMicro.length - 1;
  const finalNote = el("finalNote");
  finalNote.style.display = isFinal ? "block" : "none";
  finalNote.textContent = q.finalNote;

  const prog = el("progress");
  prog.innerHTML = "";
  q.stepLines.forEach((s,i)=>{
    const d = document.createElement("div");
    d.className = "dot" + (i === mi ? " active" : "");
    d.onclick = ()=>{ if(animating) return; jumpToMainStep(i); };
    prog.appendChild(d);
  });

  el("prevBtn").disabled = microPos <= 0;
  el("nextBtn").disabled = microPos >= flatMicro.length - 1;
}

function goForward(){
  if(animating) return;
  if(microPos >= flatMicro.length - 1) return;
  const prevMain = microPos >= 0 ? flatMicro[microPos].mainIdx : -1;
  microPos++;
  const cur = flatMicro[microPos];
  cur.fn();
  updateUI(cur.mainIdx !== prevMain);
  lockControls(cur.ms || 700);
}

/* instantly apply the cumulative state up to (and including) flatMicro[targetPos],
   with no animation — used for Back and for jumping via the progress dots */
function applyStateInstant(targetPos){
  const q = QUESTIONS[currentQ];
  q.groups.forEach(gid=> instantHideGroup(gid));
  document.querySelectorAll('[class*="gen-"]').forEach(n=> n.remove());

  const neededGroups = new Set();
  for(let i = 0; i <= targetPos; i++) neededGroups.add(q.groups[flatMicro[i].mainIdx]);

  // show the needed groups, but start every child of those groups HIDDEN —
  // we only reveal exactly what each already-clicked action actually reveals below
  neededGroups.forEach(gid=>{
    const g = el(gid);
    g.style.transition = 'none';
    g.style.opacity = 1;
    g.querySelectorAll('path, line, circle, text, rect, polygon, g').forEach(n=>{
      n.style.transition = 'none';
      if(n.tagName === 'path' || n.tagName === 'line' || n.classList.contains('drawn-circle')){
        let len; try{ len = n.getTotalLength(); } catch(e){ len = 300; }
        n.style.strokeDasharray = len;
        n.style.strokeDashoffset = len;
      } else {
        n.style.opacity = 0;
      }
    });
  });

  for(let i = 0; i <= targetPos; i++){
    const action = flatMicro[i];
    if(action.ids === 'ALL'){
      const gid = q.groups[action.mainIdx];
      el(gid).querySelectorAll('path, line, circle, text, rect, polygon').forEach(n=> instantShowElement(n));
    } else {
      (action.ids || []).forEach(id=>{
        const hide = id.charAt(0) === '-';
        const n = el(hide ? id.slice(1) : id);
        if(n) (hide ? instantHideElement : instantShowElement)(n);
      });
    }
  }
  microPos = targetPos;
}

function goBack(){
  if(animating) return;
  if(microPos <= 0) return;
  const prevMain = flatMicro[microPos].mainIdx;
  applyStateInstant(microPos - 1);
  const newMain = flatMicro[microPos].mainIdx;
  updateUI(newMain !== prevMain);
  lockControls(300);
}

function jumpToMainStep(targetMainIdx){
  if(animating) return;
  let pos = -1;
  flatMicro.forEach((m,i)=>{ if(m.mainIdx === targetMainIdx) pos = i; });
  if(pos === -1) return;
  applyStateInstant(pos);
  updateUI(true);
  lockControls(300);
}

function initQuestion(qi){
  currentQ = qi;
  flatMicro = buildFlat(QUESTIONS[qi]);
  QUESTIONS[qi].groups.forEach(gid=> instantHideGroup(gid));
  microPos = -1;
  el("qFullText").textContent = QUESTIONS[qi].question;
  goForward(); // reveal the very first action (Step 1) on load
}

el("nextBtn").onclick = goForward;
el("prevBtn").onclick = goBack;

el("qPicker").onchange = (e)=>{
  if(animating) return;
  el(QUESTIONS[currentQ].svgId).style.display = 'none';
  const qi = parseInt(e.target.value, 10);
  el("qFullText").textContent = QUESTIONS[qi].question;
  el(QUESTIONS[qi].svgId).style.display = 'block';
  initQuestion(qi);
};

initQuestion(0);
</script>

<button id="scratchToggle" aria-label="Open scratchpad" title="Scratchpad">✏️</button>
<div id="scratchPad">
  <div id="scratchHeader">
    <span id="scratchTitle">✏️ Scratchpad</span>
    <div id="scratchTools">
      <button class="stool active" data-tool="pen">Pen</button>
      <button class="stool" data-tool="eraser">Eraser</button>
      <button class="stool" id="scratchClearBtn">Clear</button>
      <button class="stool" id="scratchCloseBtn">✕</button>
    </div>
  </div>
  <canvas id="scratchCanvas"></canvas>
</div>

<script>
(function(){
  const toggleBtn = document.getElementById('scratchToggle');
  const pad = document.getElementById('scratchPad');
  const header = document.getElementById('scratchHeader');
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  const clearBtn = document.getElementById('scratchClearBtn');
  const closeBtn = document.getElementById('scratchCloseBtn');
  const toolBtns = pad.querySelectorAll('.stool[data-tool]');

  function themeColor(varName, fallback){
    const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    return v || fallback;
  }

  let currentTool = 'pen';

  /* ---------- open / close ---------- */
  toggleBtn.addEventListener('click', ()=>{
    const opening = !pad.classList.contains('open');
    pad.classList.toggle('open');
    if(opening) syncCanvasToElementSize();
  });
  closeBtn.addEventListener('click', ()=> pad.classList.remove('open'));

  /* ---------- tool selection ---------- */
  toolBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      toolBtns.forEach(b=> b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
    });
  });
  clearBtn.addEventListener('click', ()=>{
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  /* ---------- drag (header only, clamped to viewport) ---------- */
  let dragging = false, dragOffX = 0, dragOffY = 0;
  header.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.stool')) return;
    dragging = true;
    const rect = pad.getBoundingClientRect();
    dragOffX = e.clientX - rect.left;
    dragOffY = e.clientY - rect.top;
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const w = pad.offsetWidth, h = pad.offsetHeight;
    let x = e.clientX - dragOffX;
    let y = e.clientY - dragOffY;
    x = Math.max(0, Math.min(window.innerWidth - w, x));
    y = Math.max(0, Math.min(window.innerHeight - h, y));
    pad.style.left = x + 'px';
    pad.style.top = y + 'px';
    pad.style.right = 'auto';
    pad.style.bottom = 'auto';
  });
  function stopDrag(){ dragging = false; }
  header.addEventListener('pointerup', stopDrag);
  header.addEventListener('pointercancel', stopDrag);

  /* ---------- resize sync: preserve strokes across canvas buffer resize ---------- */
  function syncCanvasToElementSize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cssW = Math.max(1, Math.round(rect.width));
    const cssH = Math.max(1, Math.round(rect.height));
    const bufW = Math.max(1, Math.round(cssW * dpr));
    const bufH = Math.max(1, Math.round(cssH * dpr));
    if(canvas.width === bufW && canvas.height === bufH) return;

    const temp = document.createElement('canvas');
    temp.width = canvas.width || bufW;
    temp.height = canvas.height || bufH;
    temp.getContext('2d').drawImage(canvas, 0, 0);

    canvas.width = bufW;
    canvas.height = bufH;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(temp, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  const resizeObserver = new ResizeObserver(()=> syncCanvasToElementSize());
  resizeObserver.observe(canvas);

  /* ---------- freehand drawing: smoothed quadratic curves, speed-based width ---------- */
  let drawing = false;
  let points = [];

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, t: e.timeStamp };
  }
  function widthForSpeed(dist, dt){
    if(dt <= 0) dt = 1;
    const speed = dist / dt; // px per ms
    const w = 3.0 - speed * 5.5; // slower -> thicker
    return Math.max(1.2, Math.min(4.2, w));
  }

  canvas.addEventListener('pointerdown', (e)=>{
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    points = [getPos(e)];
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!drawing) return;
    points.push(getPos(e));
    if(points.length < 3) return;

    const p2 = points[points.length - 3];
    const p1 = points[points.length - 2];
    const p0 = points[points.length - 1];
    const midPrev = { x:(p2.x + p1.x)/2, y:(p2.y + p1.y)/2 };
    const midCur  = { x:(p1.x + p0.x)/2, y:(p1.y + p0.y)/2 };
    const dist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
    const dt = p0.t - p1.t;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(currentTool === 'eraser'){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = 20;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = themeColor('--navy-dk', '#1A3050');
      ctx.lineWidth = widthForSpeed(dist, dt);
    }
    ctx.beginPath();
    ctx.moveTo(midPrev.x, midPrev.y);
    ctx.quadraticCurveTo(p1.x, p1.y, midCur.x, midCur.y);
    ctx.stroke();
  });

  function endStroke(){
    if(!drawing) return;
    drawing = false;
    if(points.length === 1){
      const p = points[0];
      ctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
      ctx.beginPath();
      ctx.arc(p.x, p.y, currentTool === 'eraser' ? 9 : 2, 0, Math.PI * 2);
      ctx.fillStyle = themeColor('--navy-dk', '#1A3050');
      ctx.fill();
    }
    points = [];
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', ()=>{ if(drawing) endStroke(); });
})();
</script>

</body>
</html>
