<script>
const QDATA_2A = [
{id:"a1",src:"Ex 2A \u00b7 Q1",diff:"e",q:"Calculate the amount and the compound interest on \u20b925,000 for 2 years at 8% p.a., compounded annually.",given:"P = \u20b925,000 &nbsp;&nbsp; R = 8% p.a. &nbsp;&nbsp; n = 2 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\">A = 25,000(1 + <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">100</span></span>)&#178;</div>","<div class=\"line\">A = 25,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"2\">8</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"25\">100</span></span></span>)&#178;</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">25 + 2</span><span class=\"den\">25</span></span>)&#178;</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span>)&#178;</div>","<div class=\"line\">= 25,000 &times; <span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span> &times; <span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>25000</s><span class=\"arrow\">&#8594;</span><s>1000</s><span class=\"arrow\">&#8594;</span><b>40</b></span> &times; 27 &times; 27</div>","<div class=\"line\">= 40 &times; 729</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;29,160</span></div>","<div class=\"line\">C.I. = 29,160 &minus; 25,000 = <span class=\"sol-val\">&#8377;4,160</span></div>"],answer:"A = <span class=\"fa-val\">\u20b929,160</span> &nbsp;|&nbsp; C.I. = 29,160 \u2212 25,000 = <span class=\"fa-val\">\u20b94,160</span>",opts:null},
{id:"a2",src:"Ex 2A \u00b7 Q2",diff:"m",q:"Rohit borrows \u20b962,500 from Arun at 10% p.a. SI for 2 years. He lends the same to Kunal at 10% p.a. CI for 2 years. Find Rohit's profit.",given:"P = \u20b962,500 &nbsp;&nbsp; R = 10% &nbsp;&nbsp; T = 2 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">SI paid by Rohit to Arun</span></div>","<div class=\"line\">S.I.</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">62,500 \u00d7 10 \u00d7 2</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= <span class=\"sol-val\">\u20b912,500</span></div>","<div class=\"line\"><span class=\"year-label\">CI received by Rohit from Kunal</span></div>","<div class=\"line\">A</div>","<div class=\"line\">= 62,500 \u00d7 <span class=\"frac\"><span class=\"num\">110</span><span class=\"den\">100</span></span> \u00d7 <span class=\"frac\"><span class=\"num\">110</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= 62,500 \u00d7 <span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span> \u00d7 <span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span></div>","<div class=\"line\">= 625 \u00d7 121</div>","<div class=\"line\">= <span class=\"sol-val\">\u20b975,625</span></div>","<div class=\"line\">C.I.</div>","<div class=\"line\">= 75,625 \u2212 62,500</div>","<div class=\"line\">= <span class=\"sol-val\">\u20b913,125</span></div>"],answer:"Profit = 13,125 \u2212 12,500 = <span class=\"fa-val\">\u20b9625</span>",opts:null},
{id:"a3",src:"Ex 2A \u00b7 Q3",diff:"m",q:"A man invests \u20b910,000 for 3 years. At end of 1 year it amounts to \u20b911,200. Find: (i) rate % p.a. (ii) interest accrued in 2nd year (iii) amount at end of 3rd year.",given:"P = \u20b910,000 &nbsp;&nbsp; A after Y1 = \u20b911,200",formula:null,work:["<div class=\"line\"><span class=\"year-label\">(i) Finding Rate</span></div>","<div class=\"line\">S.I. for Y1</div>","<div class=\"line\">= A \u2212 P</div>","<div class=\"line\">= 11,200 \u2212 10,000</div>","<div class=\"line\">= \u20b91,200</div>","<div class=\"line\">S.I.</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">P \u00d7 R \u00d7 T</span><span class=\"den\">100</span></span> &nbsp;\u2192&nbsp; 1,200</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">10,000 \u00d7 R \u00d7 1</span><span class=\"den\">100</span></span></div>","<div class=\"line\">R</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">1,200 \u00d7 100</span><span class=\"den\">10,000</span></span></div>","<div class=\"line\">= <span class=\"sol-val\">12%</span></div>","<div class=\"line\"><span class=\"year-label\">(ii) Interest accrued in 2nd year (P = \u20b911,200)</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">11,200 \u00d7 12 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b91,344</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 11,200 + 1,344 = <span class=\"sol-val\">\u20b912,544</span></div>","<div class=\"line\"><span class=\"year-label\">(iii) Amount at end of 3rd year (P = \u20b912,544)</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">12,544 \u00d7 12 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b91,505.28</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 12,544 + 1,505.28 = <span class=\"sol-val\">\u20b914,049.28</span></div>"],answer:"R = <span class=\"fa-val\">12%</span> &nbsp;|&nbsp; Y2 interest = <span class=\"fa-val\">\u20b91,344</span> &nbsp;|&nbsp; A\u2083 = <span class=\"fa-val\">\u20b914,049.28</span>",opts:null},

{id:"a7",src:"Ex 2A \u00b7 Q7",diff:"m",q:"Calculate the amount of \u20b930,000 at the end of 2 years 4 months, compounded annually at 10% p.a.",given:"P = \u20b930,000 &nbsp;&nbsp; R = 10% &nbsp;&nbsp; T = 2 years 4 months<br>For 2 full years \u2192 use CI. For remaining 4 months \u2192 use SI on new amount.",formula:null,work:["<div class=\"line\"><span class=\"year-label\">1st Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">30,000 \u00d7 10 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b93,000</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 30,000 + 3,000 = <span class=\"sol-val\">\u20b933,000</span></div>","<div class=\"line\"><span class=\"year-label\">2nd Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">33,000 \u00d7 10 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b93,300</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 33,000 + 3,300 = <span class=\"sol-val\">\u20b936,300</span></div>","<div class=\"line\"><span class=\"year-label\">4 Months \u2014 S.I. on \u20b936,300</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">36,300 \u00d7 10 \u00d7 4</span><span class=\"den\">100 \u00d7 12</span></span> = <span class=\"sol-val\">\u20b91,210</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 36,300 + 1,210 = <span class=\"sol-val\">\u20b937,510</span></div>"],answer:"A = <span class=\"fa-val\">\u20b937,510</span>",opts:null},
{id:"a8",src:"Ex 2A \u00b7 Q8",diff:"m",q:"Calculate the amount of \u20b931,250 at end of 2\u00bd years, compounded annually at 8% p.a.",given:"P = \u20b931,250 &nbsp;&nbsp; R = 8% &nbsp;&nbsp; T = 2\u00bd years<br>For 2 full years \u2192 use CI. For remaining \u00bd year \u2192 use SI on new amount.",formula:null,work:["<div class=\"line\"><span class=\"year-label\">1st Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">31,250 \u00d7 8 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b92,500</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 31,250 + 2,500 = <span class=\"sol-val\">\u20b933,750</span></div>","<div class=\"line\"><span class=\"year-label\">2nd Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">33,750 \u00d7 8 \u00d7 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">\u20b92,700</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 33,750 + 2,700 = <span class=\"sol-val\">\u20b936,450</span></div>","<div class=\"line\"><span class=\"year-label\">\u00bd Year \u2014 S.I. on \u20b936,450</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">36,450 \u00d7 8 \u00d7 1</span><span class=\"den\">100 \u00d7 2</span></span> = <span class=\"sol-val\">\u20b91,458</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 36,450 + 1,458 = <span class=\"sol-val\">\u20b937,908</span></div>"],answer:"A = <span class=\"fa-val\">\u20b937,908</span>",opts:null},
{id:"a9",src:"Ex 2A \u00b7 Q9",diff:"e",q:"Calculate Amount and CI on \u20b915,000 for 2 years at 8% and 9% for successive years.",given:"P = \u20b915,000 &nbsp;&nbsp; r\u2081 = 8%, r\u2082 = 9%",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R&#8321;</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">R&#8322;</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">A = 15,000(1 + <span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">A = 15,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"2\">8</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"25\">100</span></span></span>)(1 + <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">= 15,000(<span class=\"frac\"><span class=\"num\">25 + 2</span><span class=\"den\">25</span></span>)(<span class=\"frac\"><span class=\"num\">100 + 9</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">= 15,000(<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span>)(<span class=\"frac\"><span class=\"num\">109</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">= 15,000 &times; <span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span> &times; <span class=\"frac\"><span class=\"num\">109</span><span class=\"den\">100</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>15000</s><span class=\"arrow\">&#8594;</span><s>600</s><span class=\"arrow\">&#8594;</span><b>6</b></span> &times; 27 &times; 109</div>","<div class=\"line\">= 6 &times; 2,943</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;17,658</span></div>","<div class=\"line\">C.I. = 17,658 &minus; 15,000 = <span class=\"sol-val\">&#8377;2,658</span></div>"],answer:"A = <span class=\"fa-val\">\u20b917,658</span> &nbsp;|&nbsp; C.I. = 17,658 \u2212 15,000 = <span class=\"fa-val\">\u20b92,658</span>",opts:null},
{id:"a10",src:"Ex 2A \u00b7 Q10",diff:"e",q:"Calculate Amount and CI on \u20b925,000 for 3 years at 8%, 9% and 10% for successive years.",given:"P = \u20b925,000 &nbsp;&nbsp; r\u2081 = 8%, r\u2082 = 9%, r\u2083 = 10%",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R&#8321;</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">R&#8322;</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">R&#8323;</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">A = 25,000(1 + 8&#8260;100)(1 + 9&#8260;100)(1 + 10&#8260;100)</div>","<div class=\"line\">A = 25,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"2\">8</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"25\">100</span></span></span>)(1 + <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">10</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"10\">100</span></span></span>)</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">25 + 2</span><span class=\"den\">25</span></span>)(<span class=\"frac\"><span class=\"num\">100 + 9</span><span class=\"den\">100</span></span>)(<span class=\"frac\"><span class=\"num\">10 + 1</span><span class=\"den\">10</span></span>)</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span>)(<span class=\"frac\"><span class=\"num\">109</span><span class=\"den\">100</span></span>)(<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)</div>","<div class=\"line\">= 25,000 &times; <span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">25</span></span> &times; <span class=\"frac\"><span class=\"num\">109</span><span class=\"den\">100</span></span> &times; <span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>25000</s><span class=\"arrow\">&#8594;</span><s>1000</s><span class=\"arrow\">&#8594;</span><s>10</s><span class=\"arrow\">&#8594;</span><b>1</b></span> &times; 27 &times; 109 &times; 11</div>","<div class=\"line\">= 27 &times; 109 &times; 11</div>","<div class=\"line\">= 2,943 &times; 11</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;32,373</span></div>","<div class=\"line\">C.I. = 32,373 &minus; 25,000 = <span class=\"sol-val\">&#8377;7,373</span></div>"],answer:"A = <span class=\"fa-val\">\u20b932,373</span> &nbsp;|&nbsp; C.I. = 32,373 \u2212 25,000 = <span class=\"fa-val\">\u20b97,373</span>",opts:null},

{id:"b7",src:"Ex 2B \u00b7 Q7",diff:"m",q:"Calculate Amount and CI on \u20b916,000 for 1 year at 15% p.a. compounded half-yearly.",given:"P = \u20b916,000 &nbsp;&nbsp; R = 15% p.a. &nbsp;&nbsp; T = 1 year<br>Compounded half-yearly: rate = 7.5% = 3/40 per half-year, n = 2",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(half-yearly: R = 7.5%, n = 2)</span></div>","<div class=\"line\">A = 16,000(1 + <span class=\"frac\"><span class=\"num\">7.5</span><span class=\"den\">100</span></span>)&#178;</div>","<div class=\"line\">A = 16,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"3\">7.5</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"40\">100</span></span></span>)&#178;</div>","<div class=\"line\">= 16,000(<span class=\"frac\"><span class=\"num\">40 + 3</span><span class=\"den\">40</span></span>)&#178;</div>","<div class=\"line\">= 16,000(<span class=\"frac\"><span class=\"num\">43</span><span class=\"den\">40</span></span>)&#178;</div>","<div class=\"line\">= 16,000 &times; <span class=\"frac\"><span class=\"num\">43</span><span class=\"den\">40</span></span> &times; <span class=\"frac\"><span class=\"num\">43</span><span class=\"den\">40</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>16000</s><span class=\"arrow\">&#8594;</span><s>400</s><span class=\"arrow\">&#8594;</span><b>10</b></span> &times; 43 &times; 43</div>","<div class=\"line\">= 10 &times; 1,849</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;18,490</span></div>"],answer:"A = <span class=\"fa-val\">\u20b918,490</span> &nbsp;|&nbsp; C.I. = 18,490 \u2212 16,000 = <span class=\"fa-val\">\u20b92,490</span>",opts:null},
{id:"b8",src:"Ex 2B \u00b7 Q8",diff:"m",q:"Find Amount and CI on \u20b91,25,000 for 1\u00bd years at 12% p.a. compounded half-yearly.",given:"P = \u20b91,25,000 &nbsp;&nbsp; R = 12% p.a. &nbsp;&nbsp; T = 1\u00bd years<br>Compounded half-yearly: rate = 6% = 6/100 = 3/50 per half-year, n = 3",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(half-yearly: R = 6%, n = 3)</span></div>","<div class=\"line\">A = 1,25,000(1 + <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\">A = 1,25,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"3\">6</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"50\">100</span></span></span>)&#179;</div>","<div class=\"line\">= 1,25,000(<span class=\"frac\"><span class=\"num\">50 + 3</span><span class=\"den\">50</span></span>)&#179;</div>","<div class=\"line\">= 1,25,000(<span class=\"frac\"><span class=\"num\">53</span><span class=\"den\">50</span></span>)&#179;</div>","<div class=\"line\">= 1,25,000 &times; <span class=\"frac\"><span class=\"num\">53</span><span class=\"den\">50</span></span> &times; <span class=\"frac\"><span class=\"num\">53</span><span class=\"den\">50</span></span> &times; <span class=\"frac\"><span class=\"num\">53</span><span class=\"den\">50</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>1,25,000</s><span class=\"arrow\">&#8594;</span><s>2,500</s><span class=\"arrow\">&#8594;</span><s>50</s><span class=\"arrow\">&#8594;</span><b>1</b></span> &times; 53 &times; 53 &times; 53</div>","<div class=\"line\">= 53 &times; 53 &times; 53</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;1,48,877</span></div>"],answer:"A = <span class=\"fa-val\">\u20b91,48,877</span> &nbsp;| {id:"b9",src:"Ex 2B \u00b7 Q9",diff:"h",q:"\u20b912,500 deposited for 1\u00bd years compounded half-yearly amounts to \u20b913,000 at end of first half-year. Find: (i) rate of interest p.a. (ii) final amount correct to nearest rupee.",given:"P = \u20b912,500 &nbsp;&nbsp; A after 1st half-year = \u20b913,000 &nbsp;&nbsp; T = 1\u00bd years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">(i) Finding Rate per half-year</span></div>","<div class=\"line\">S.I. for 1st half-year</div>","<div class=\"line\">= A \u2212 P</div>","<div class=\"line\">= 13,000 \u2212 12,500</div>","<div class=\"line\">= \u20b9500</div>","<div class=\"line\">S.I.</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">P \u00d7 R \u00d7 T</span><span class=\"den\">100</span></span> &nbsp;\u2192&nbsp; 500</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">12,500 \u00d7 R \u00d7 1</span><span class=\"den\">100</span></span></div>","<div class=\"line\">R</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">500 \u00d7 100</span><span class=\"den\">12,500</span></span></div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">500</span><span class=\"den\">125</span></span></div>","<div class=\"line\">= 4% per half-year</div>","<div class=\"line\">\u2234 Rate of interest p.a.</div>","<div class=\"line\">= 4 \u00d7 2</div>","<div class=\"line\">= <span class=\"sol-val\">8% p.a.</span></div>","<div class=\"line\"><span class=\"year-label\">(ii) Final Amount &mdash; n = 3 half-years, R = 4% per half-year, P = &#8377;12,500</span></div>","<div class=\"line\">A = 12,500(1 + <span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\">= 12,500(<span class=\"frac\"><span class=\"num\">26</span><span class=\"den\">25</span></span>)&#179;</div>","<div class=\"line\">= 12,500 &times; <span class=\"frac\"><span class=\"num\">26</span><span class=\"den\">25</span></span {id:"p9",src:"Practice · Q9",diff:"m",q:"The rate of depreciation of a machine is 16% p.a. The present value of the machine is ₹9,261. Find its value 3 years ago.",given:"Present value = ₹9,261 &nbsp;&nbsp; R = 16% depreciation p.a. &nbsp;&nbsp; n = 3 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">V&#8345;</span><span class=\"den\">(1 &minus; R&#8260;100)&#8319;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">(1 &minus; 16&#8260;100)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">(1 &minus; <span class=\"cxl\" data-to=\"4\">16</span>&#8260;<span class=\"cxl-below\" data-to=\"25\">100</span>)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">(25 &minus; 4&#8260;25)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">(21&#8260;25)&#179;</span></span></div>","<div class=\"line\">V&#8320; = 9,261 &times; <span class=\"frac\"><span class=\"num\">25</span><span class=\"den\">21</span></span> &times; <span class=\"frac\"><span class=\"num\">25</span><span class=\"den\">21</span></span> &times; <span class=\"frac\"><span class=\"num\">25</span><span class=\"den\">21</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>9,261</s><span class=\"arrow\">&#8594;</span><s>441</s><span class=\"arrow\">&#8594;</span><s>21</s><span class=\"arrow\">&#8594;</span><b>1</b></span> &times; 25 &times; 25 &times; 25</div>","<div class=\"line\">= 25 &times; 25 &times; 25</div>","<div class=\"line\">V&#8320; = <span class=\"sol-val\">&#8377;15,625</span></div>"],answer:"Value 3 years ago = <span class=\"fa-val\">&#8377;15,625</span>",op {id:"p10",src:"Practice · Q10",diff:"e",q:"In what time will ₹1,000 amount to ₹1,210 at 10% p.a compounded annually?",given:"P = ₹1,000 &nbsp;&nbsp; A = ₹1,210 &nbsp;&nbsp; R = 10% p.a. &nbsp;&nbsp; Find: n",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\">1,210 = 1,000(1 + <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">1,210</span><span class=\"den\">1,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">121</span><span class=\"den\">100</span></span> = (1 + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">10</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(reducing 1,210/1,000 by 10, and 10/100 by 10)</span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">121</span><span class=\"den\">100</span></span> = (<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)&#8319;</div>","<div class=\"line\">(<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)&#178; = (<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(since 11&#178; = 121 and 10&#178; = 100)</span></div>","<div class=\"line\">&there4; <span class=\"sol-val\">n = 2 years</span></div>"],answer:"Time = <span class=\"fa-val\">2 years</span>",opts:null},
{id:"p11",src:"Practice · Q11",diff:"h",q:"Kiran borrowed ₹18,000 from Sunita for 3 years at 15% p.a simple interest. She lent this sum to Rahul at the same rate for the same period but compounded annually. Calculate Kiran's gain in the transaction at the end of 3 years.",given:"P = ₹18,000 &nbsp;&nbsp; R = 15% &nbsp;&nbsp; T = 3 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">S.I. paid by Kiran to Sunita</span></div>","<div class=\"line\">S.I.</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">18,000 &times; 15 &times; 3</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;8,100</span></div>","<div class=\"line\"><span class=\"year-label\">C.I. received by Kiran from Rahul</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">18,000 &times; 15 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;2,700</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 18,000 + 2,700 = <span class=\"sol-val\">&#8377;20,700</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">20,700 &times; 15 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;3,105</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 20,700 + 3,105 = <span class=\"sol-val\">&#8377;23,805</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">23,805 &times; 15 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;3,570.75</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 23,805 + 3,570.75 = <span class=\"sol-val\">&#8377;27,375.75</span></div>","<div class=\"line\">C.I.</div>","<div class=\"line\">= 27,375.75 &minus; 18,000</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;9,375.75</span></div>"],answer:"Gain = 9,375.75 − 8,100 = <span class=\"fa-val\">&#8377;1,275.75</span>",opts:null},
{id:"p12",src:"Practice · Q12",diff:"h",q:"A sum of ₹25,000 invested for 1½ years compounded half yearly amounts to ₹28,121.60. Calculate the annual rate of the investment.",given:"P = ₹25,000 &nbsp;&nbsp; A = ₹28,121.60 &nbsp;&nbsp; T = 1½ years (n = 3 half-years) &nbsp;&nbsp; Find: R (annual)",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working (r = rate per half-year)</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\">28,121.60 = 25,000(1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">28,121.60</span><span class=\"den\">25,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">17,576</span><span class=\"den\">15,625</span></span> = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179; <span style=\"color:#9a9284;font-size:12px\">(multiplying by 100 and reducing)</span></div>","<div class=\"line\">(<span class=\"frac\"><span class=\"num\">26</span><span class=\"den\">25</span></span>)&#179; = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179; <span style=\"color:#9a9284;font-size:12px\">(since 26&#179; = 17,576 and 25&#179; = 15,625)</span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">26</span><span class=\"den\">25</span></span> = 1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">26</span><span class=\"den\">25</span></span> − 1</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">25</span></span></div>","<div class=\"line\">r</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">1 &times; 100</span><span class=\"den\">25</span></span></div>","<div class=\"line\">&there4; <span class=\"sol-val\">r = 4% per half-year</span></div>","<div class=\"line\">Annual rate</div>","<div class=\"line\">= 4 &times; 2</div>","<div class=\"line\">= <span class=\"sol-val\">8% p.a.</span></div>"],answer:"Annual rate = <span class=\"fa-val\">8% p.a.</span>",opts:null},
{id:"p13",src:"Practice · Q13",diff:"m",q:"The value of a machine purchased three years ago, depreciates at the annual rate of 10%. If its present value is ₹8,748, find its value when it was purchased.",given:"Present value = ₹8,748 &nbsp;&nbsp; R = 10% depreciation p.a. &nbsp;&nbsp; n = 3 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">V&#8345;</span><span class=\"den\">(1 &minus; R&#8260;100)&#8319;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">8,748</span><span class=\"den\">(1 &minus; 10&#8260;100)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">8,748</span><span class=\"den\">(1 &minus; <span class=\"cxl\" data-to=\"1\">10</span>&#8260;<span class=\"cxl-below\" data-to=\"10\">100</span>)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">8,748</span><span class=\"den\">(10 &minus; 1&#8260;10)&#179;</span></span></div>","<div class=\"line\">V&#8320; = <span class=\"frac\"><span class=\"num\">8,748</span><span class=\"den\">(9&#8260;10)&#179;</span></span></div>","<div class=\"line\">V&#8320; = 8,748 &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">9</span></span> &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">9</span></span> &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">9</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>8,748</s><span class=\"arrow\">&#8594;</span><s>972</s><span class=\"arrow\">&#8594;</span><s>108</s><span class=\"arrow\">&#8594;</span><b>12</b></span> &times; 10 &times; 10 &times; 10</div>","<div class=\"line\">= 12 &times; 1,000</div>","<div class=\"line\">V&#8320; = <span class=\"sol-val\">&#8377;12,000</span></div>"],answer:"Value when purchased = <span class=\"fa-val\">&#8377;12,000</span>",opts:null},
{id:"p14",src:"Practice · Q14",diff:"h",q:"The population of a town increased by 10% in the first year, decreased by 5% in the second year and again increased by 20% in the third year. If at the end of the third year the population of the town was 3,13,500, find the population at the start of the first year.",given:"P&#8323; (end of Y3) = 3,13,500 &nbsp;&nbsp; R₁ = +10%, R₂ = −5%, R₃ = +20%",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">P&#8323; = P&#8320;(1 + <span class=\"frac\"><span class=\"num\">R&#8321;</span><span class=\"den\">100</span></span>)(1 &minus; <span class=\"frac\"><span class=\"num\">R&#8322;</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">R&#8323;</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">3,13,500 = P&#8320;(1 + 10&#8260;100)(1 &minus; 5&#8260;100)(1 + 20&#8260;100)</div>","<div class=\"line\">3,13,500 = P&#8320;(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">10</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"10\">100</span></span></span>)(1 &minus; <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">5</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"20\">100</span></span></span>)(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">20</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"5\">100</span></span></span>)</div>","<div class=\"line\">= P&#8320;(<span class=\"frac\"><span class=\"num\">10 + 1</span><span class=\"den\">10</span></span>)(<span class=\"frac\"><span class=\"num\">20 &minus; 1</span><span class=\"den\">20</span></span>)(<span class=\"frac\"><span class=\"num\">5 + 1</span><span class=\"den\">5</span></span>)</div>","<div class=\"line\">= P&#8320;(<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)(<span class=\"frac\"><span class=\"num\">19</span><span class=\"den\">20</span></span>)(<span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">5</span></span>)</div>","<div class=\"line\">3,13,500 = P&#8320; &times; <span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span> &times; <span class=\"frac\"><span class=\"num\">19</span><span class=\"den\">20</span></span> &times; <span class=\"frac\"><span class=\"num\">6</span><span class=\"den\">5</span></span></div>","<div class=\"line\">P&#8320; = 3,13,500 &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">11</span></span> &times; <span class=\"frac\"><span class=\"num\">20</span><span class=\"den\">19</span></span> &times; <span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">6</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>3,13,500</s><span class=\"arrow\">&#8594;</span><s>28,500</s><span class=\"arrow\">&#8594;</span><s>1,500</s><span class=\"arrow\">&#8594;</span><b>250</b></span> &times; 10 &times; 20 &times; 5</div>","<div class=\"line\">= 250 &times; 10 &times; 20 &times; 5</div>","<div class=\"line\">&there4; <span class=\"sol-val\">P&#8320; = 2,50,000</span></div>"],answer:"Population at start of 1st year = <span class=\"fa-val\">2,50,000</span>",opts:null},
{id:"p15",src:"Practice · Q15",diff:"m",q:"Find the compound interest on ₹1,500 for 2½ years at 10% p.a compounded annually.",given:"P = ₹1,500 &nbsp;&nbsp; R = 10% &nbsp;&nbsp; T = 2½ years<br>For 2 full years → use CI. For remaining ½ year → use SI on new amount.",formula:null,work:["<div class=\"line\"><span class=\"year-label\">1st Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">1,500 &times; 10 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;150</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 1,500 + 150 = <span class=\"sol-val\">&#8377;1,650</span></div>","<div class=\"line\"><span class=\"year-label\">2nd Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">1,650 &times; 10 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;165</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 1,650 + 165 = <span class=\"sol-val\">&#8377;1,815</span></div>","<div class=\"line\"><span class=\"year-label\">½ Year — S.I. on ₹1,815</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">1,815 &times; 10 &times; 1</span><span class=\"den\">100 &times; 2</span></span> = <span class=\"sol-val\">&#8377;90.75</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 1,815 + 90.75 = <span class=\"sol-val\">&#8377;1,905.75</span></div>","<div class=\"line\">C.I.</div>","<div class=\"line\">= 1,905.75 &minus; 1,500</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;405.75</span></div>"],answer:"C.I. = 1,905.75 − 1,500 = <span class=\"fa-val\">&#8377;405.75</span>",opts:null},
{id:"p16",src:"Practice · Q16",diff:"e",q:"If ₹8,000 amounts to ₹9,261 at 5% p.a. compounded annually, then the time period is:",given:"P = ₹8,000 &nbsp;&nbsp; A = ₹9,261 &nbsp;&nbsp; R = 5% p.a. &nbsp;&nbsp; Find: n",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\">9,261 = 8,000(1 + <span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">8,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">8,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">20</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(reducing 5/100 by 5; 9,261/8,000 already in lowest terms)</span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">8,000</span></span> = (<span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span>)&#8319;</div>","<div class=\"line\">(<span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span>)&#179; = (<span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span>)&#8319; <span style=\"color:#9a9284;font-size:12px\">(since 21&#179; = 9,261 and 20&#179; = 8,000)</span></div>","<div class=\"line\">&there4; <span class=\"sol-val\">n = 3 years</span></div>"],answer:"Answer: (d) <span class=\"fa-val\">3 years</span>",opts:[{text:"2½ years",correct:false},{text:"1 year",correct:false},{text:"2 years",correct:false},{text:"3 years",correct:true}]},
{id:"p17",src:"Practice · Q17",diff:"m",q:"Shreya borrowed ₹25,000 from Riya for 2 years at 12% p.a. simple interest. She invested the same amount at 12% p.a. compound interest (compounded annually) for the same time period. Calculate her total gain.",given:"P = ₹25,000 &nbsp;&nbsp; R = 12% &nbsp;&nbsp; T = 2 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">S.I. paid by Shreya to Riya</span></div>","<div class=\"line\">S.I.</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">25,000 &times; 12 &times; 2</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;6,000</span></div>","<div class=\"line\"><span class=\"year-label\">C.I. received by Shreya (investment)</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">R</span><span class=\"den\">100</span></span>)&#178;</div>","<div class=\"line\">A = 25,000(1 + <span class=\"frac\"><span class=\"num\">12</span><span class=\"den\">100</span></span>)&#178;</div>","<div class=\"line\">A = 25,000(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"3\">12</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"25\">100</span></span></span>)&#178;</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">25 + 3</span><span class=\"den\">25</span></span>)&#178;</div>","<div class=\"line\">= 25,000(<span class=\"frac\"><span class=\"num\">28</span><span class=\"den\">25</span></span>)&#178;</div>","<div class=\"line\">= 25,000 &times; <span class=\"frac\"><span class=\"num\">28</span><span class=\"den\">25</span></span> &times; <span class=\"frac\"><span class=\"num\">28</span><span class=\"den\">25</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>25,000</s><span class=\"arrow\">&#8594;</span><s>1,000</s><span class=\"arrow\">&#8594;</span><b>40</b></span> &times; 28 &times; 28</div>","<div class=\"line\">= 40 &times; 784</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;31,360</span></div>","<div class=\"line\">C.I.</div>","<div class=\"line\">= 31,360 &minus; 25,000</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;6,360</span></div>"],answer:"Gain = 6,360 − 6,000 = <span class=\"fa-val\">&#8377;360</span>",opts:null},
{id:"p18",src:"Practice · Q18",diff:"m",q:"If ₹40,000 amounts to ₹46,305 in 1½ years, compound interest payable half-yearly, find the rate of interest per annum.",given:"P = ₹40,000 &nbsp;&nbsp; A = ₹46,305 &nbsp;&nbsp; T = 1½ years (n = 3 half-years) &nbsp;&nbsp; Find: R (annual)",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working (r = rate per half-year)</span></div>","<div class=\"line\">A = P(1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#8319;</div>","<div class=\"line\">46,305 = 40,000(1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">46,305</span><span class=\"den\">40,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179;</div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">9,261</span><span class=\"den\">8,000</span></span> = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179; <span style=\"color:#9a9284;font-size:12px\">(dividing both by 5)</span></div>","<div class=\"line\">(<span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span>)&#179; = (1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span>)&#179; <span style=\"color:#9a9284;font-size:12px\">(since 21&#179; = 9,261 and 20&#179; = 8,000)</span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span> = 1 + <span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span></div>","<div class=\"line\"><span class=\"frac\"><span class=\"num\">r</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">21</span><span class=\"den\">20</span></span> − 1</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">20</span></span></div>","<div class=\"line\">r</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">1 &times; 100</span><span class=\"den\">20</span></span></div>","<div class=\"line\">&there4; <span class=\"sol-val\">r = 5% per half-year</span></div>","<div class=\"line\">Annual rate</div>","<div class=\"line\">= 5 &times; 2</div>","<div class=\"line\">= <span class=\"sol-val\">10% p.a.</span></div>"],answer:"Rate = <span class=\"fa-val\">10% p.a.</span>",opts:null},
{id:"p19",src:"Practice · Q19",diff:"e",q:"A car worth ₹35,000 depreciates at 10% p.a. Find its value after 2 years.",given:"P = ₹35,000 &nbsp;&nbsp; R = 10% depreciation p.a. &nbsp;&nbsp; n = 2 years",formula:null,work:["<div class=\"line\"><span class=\"year-label\">After 1st Year</span></div>","<div class=\"line\">Depreciation</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">35,000 &times; 10</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= &#8377;3,500</div>","<div class=\"line\">Value</div>","<div class=\"line\">= 35,000 &minus; 3,500</div>","<div class=\"line\">= &#8377;31,500</div>","<div class=\"line\"><span class=\"year-label\">After 2nd Year</span></div>","<div class=\"line\">Depreciation</div>","<div class=\"line\">= <span class=\"frac\"><span class=\"num\">31,500 &times; 10</span><span class=\"den\">100</span></span></div>","<div class=\"line\">= &#8377;3,150</div>","<div class=\"line\">Value</div>","<div class=\"line\">= 31,500 &minus; 3,150</div>","<div class=\"line\">= &#8377;28,350</div>"],answer:"Value after 2 years = <span class=\"fa-val\">&#8377;28,350</span>",opts:null},
{id:"p20",src:"Practice · Q20",diff:"h",q:"A population increases by 10% in the first year, decreases by 20% in the second year and then increases by 30% in the third year. If the population at the end of the third year is 57,200, find the initial population.",given:"P&#8323; (end of Y3) = 57,200 &nbsp;&nbsp; R₁ = +10%, R₂ = −20%, R₃ = +30%",formula:null,work:["<div class=\"line\"><span class=\"year-label\">Working</span></div>","<div class=\"line\">P&#8323; = P&#8320;(1 + <span class=\"frac\"><span class=\"num\">R&#8321;</span><span class=\"den\">100</span></span>)(1 &minus; <span class=\"frac\"><span class=\"num\">R&#8322;</span><span class=\"den\">100</span></span>)(1 + <span class=\"frac\"><span class=\"num\">R&#8323;</span><span class=\"den\">100</span></span>)</div>","<div class=\"line\">57,200 = P&#8320;(1 + 10&#8260;100)(1 &minus; 20&#8260;100)(1 + 30&#8260;100)</div>","<div class=\"line\">57,200 = P&#8320;(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">10</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"10\">100</span></span></span>)(1 &minus; <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"1\">20</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"5\">100</span></span></span>)(1 + <span class=\"frac\"><span class=\"num\"><span class=\"cxl\" data-to=\"3\">30</span></span><span class=\"den\"><span class=\"cxl-below\" data-to=\"10\">100</span></span></span>)</div>","<div class=\"line\">= P&#8320;(<span class=\"frac\"><span class=\"num\">10 + 1</span><span class=\"den\">10</span></span>)(<span class=\"frac\"><span class=\"num\">5 &minus; 1</span><span class=\"den\">5</span></span>)(<span class=\"frac\"><span class=\"num\">10 + 3</span><span class=\"den\">10</span></span>)</div>","<div class=\"line\">= P&#8320;(<span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span>)(<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">5</span></span>)(<span class=\"frac\"><span class=\"num\">13</span><span class=\"den\">10</span></span>)</div>","<div class=\"line\">57,200 = P&#8320; &times; <span class=\"frac\"><span class=\"num\">11</span><span class=\"den\">10</span></span> &times; <span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">5</span></span> &times; <span class=\"frac\"><span class=\"num\">13</span><span class=\"den\">10</span></span></div>","<div class=\"line\">P&#8320; = 57,200 &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">11</span></span> &times; <span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">4</span></span> &times; <span class=\"frac\"><span class=\"num\">10</span><span class=\"den\">13</span></span></div>","<div class=\"line\"><span class=\"cxl-chain\"><s>57,200</s><span class=\"arrow\">&#8594;</span><s>5,200</s><span class=\"arrow\">&#8594;</span><s>1,300</s><span class=\"arrow\">&#8594;</span><b>100</b></span> &times; 10 &times; 5 &times; 10</div>","<div class=\"line\">= 100 &times; 10 &times; 5 &times; 10</div>","<div class=\"line\">&there4; <span class=\"sol-val\">P&#8320; = 50,000</span></div>"],answer:"Initial population = <span class=\"fa-val\">50,000</span>",opts:null},
{id:"p21",src:"Practice · Q21",diff:"m",q:"Find compound interest on ₹15,000 for 1½ years at 8% p.a. compounded annually.",given:"P = ₹15,000 &nbsp;&nbsp; R = 8% &nbsp;&nbsp; T = 1½ years<br>For 1 full year → use CI. For remaining ½ year → use SI on new amount.",formula:null,work:["<div class=\"line\"><span class=\"year-label\">1st Year</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">15,000 &times; 8 &times; 1</span><span class=\"den\">100</span></span> = <span class=\"sol-val\">&#8377;1,200</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 15,000 + 1,200 = <span class=\"sol-val\">&#8377;16,200</span></div>","<div class=\"line\"><span class=\"year-label\">½ Year — S.I. on ₹16,200</span></div>","<div class=\"line\"><span class=\"sol-var\">I</span> = <span class=\"frac\"><span class=\"num\">16,200 &times; 8 &times; 1</span><span class=\"den\">100 &times; 2</span></span> = <span class=\"sol-val\">&#8377;648</span></div>","<div class=\"line\"><span class=\"sol-var\">A</span> = 16,200 + 648 = <span class=\"sol-val\">&#8377;16,848</span></div>","<div class=\"line\">C.I.</div>","<div class=\"line\">= 16,848 &minus; 15,000</div>","<div class=\"line\">= <span class=\"sol-val\">&#8377;1,848</span></div>"],answer:"C.I. = 16,848 − 15,000 = <span class=\"fa-val\">&#8377;1,848</span>",opts:null}
];

const FORMULAE = [
  {h:'Compound Interest (compounded annually)', lines:['A = P(1 + R/100)&#8319;','C.I. = A &minus; P'], note:'P = Principal, R = rate % p.a., n = number of years'},
  {h:'Compounded Half-Yearly', lines:['Rate per half-year = R/2%','Number of periods = 2n','A = P(1 + (R/2)/100)&#178;&#8319;']},
  {h:'Variable Rates (different rate each year)', lines:['A = P(1 + R&#8321;/100)(1 + R&#8322;/100)(1 + R&#8323;/100)&#8230;']},
  {h:'Population / Growth &amp; Decay', lines:['Increase: P&#8345; = P&#8320;(1 + R/100)&#8319;','Decrease (depreciation): P&#8345; = P&#8320;(1 &minus; R/100)&#8319;']},
  {h:'Difference between CI and SI', lines:['For 2 years: CI &minus; SI = P(R/100)&#178;','For 3 years: CI &minus; SI = P(R/100)&#178;[(300+R)/100]']}
];

const SECTIONS = [
  {id:'ex2a', label:'Exercise 2A', data:QDATA_2A},
  {id:'ex2b', label:'Exercise 2B', data:QDATA_2B},
  {id:'ex2c', label:'Exercise 2C', data:QDATA_2C},
  {id:'mcq',  label:'MCQ',         data:QDATA_MCQ},
  {id:'practice', label:'Practice Question Bank', data:QDATA_PRACTICE}
];
const DIFF = {e:['b-easy','Easy'], m:['b-med','Medium'], h:['b-hard','Hard']};
const REPORT_META = { board:'ICSE', grade:'9', chapter:'Compound Interest' };
const REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx3vGZZjTHbAnKtOwSz6TaWtpYtnudCzxKMtm3Eo9bB4Ey6Xlor6LunLFEmyIQQy5e6/exec';

function workRows(arr){
  let h = '';
  (arr||[]).forEach(function(l){ h += l; });
  return h;
}

function solBody(q){
  let h = '';
  if(q.given){
    h += '<div class="sol-given"><div class="sol-h">Given</div><div class="g">'+q.given+'</div></div>';
  }
  if(q.formula){
    h += '<div class="sol-formula"><div class="sol-h">Formula</div><div class="fml">'+q.formula+'</div></div>';
  }
  if(q.work && q.work.length){
    h += '<div class="sol-work"><div class="sol-h">Working</div>'+workRows(q.work)+'</div>';
  }
  if(q.answer){
    h += '<div class="sol-answer"><div class="sol-h">Answer</div><div class="a">'+q.answer+'</div></div>';
  }
  return h;
}

function cardHTML(q, no, isAR){
  const d = DIFF[q.diff] || DIFF.m;
  const cls = isAR ? 'q-ar' : 'q-sa';
  let h = '<div class="qcard '+cls+'" data-diff="'+d[1]+'" data-no="'+no+'">'
        + '<div class="qcard-stripe"></div><div class="qcard-body">';
  h += '<div class="badge-row">'
     + '<span class="badge b-src">'+q.src+'</span>'
     + '<span class="badge '+d[0]+'">'+d[1]+'</span>'
     + '<span class="qno">Q'+no+'</span>'
     + '</div>';

  if(q.parts){
    h += '<div class="qt">'+q.stem+'</div>';
    q.parts.forEach(function(p){
      h += '<div class="qt-part"><b>('+p.label+')</b> '+p.q+'</div>';
    });
    h += '<button class="sol-toggle">Show Solution</button>';
    h += '<button class="rep-btn">Report Error</button>';
    let inner = '';
    q.parts.forEach(function(p){
      inner += '<div class="sol-h" style="color:#0D2B4E;margin-top:10px">Part ('+p.label+')</div>' + solBody(p);
    });
    h += '<div class="sol-box">'+inner+'</div>';
    h += '</div></div>';
    return h;
  }

  if(isAR){
    h += '<div class="ar-stem">'+q.q+'</div>';
  } else {
    h += '<div class="qt">'+q.q+'</div>';
  }

  if(q.opts){
    h += '<ul class="mcq-opts">';
    q.opts.forEach(function(o,i){
      h += '<li class="mopt" data-i="'+i+'" data-correct="'+(o.correct?'1':'0')+'"><span class="lab">('+'abcd'[i]+')</span><span>'+o.text+'</span></li>';
    });
    h += '</ul>';
  }

  h += '<button class="sol-toggle">Show Solution</button>';
  h += '<button class="rep-btn">Report Error</button>';
  h += '<div class="sol-box">'+solBody(q)+'</div>';
  h += '</div></div>';
  return h;
}

function formulaeHTML(){
  let h = '';
  FORMULAE.forEach(function(f){
    h += '<div class="formula-card"><div class="formula-header">'+f.h+'<span class="arrow">+</span></div>'
       + '<div class="formula-body"><div class="fml">'+f.lines.join('<br>')+'</div>'
       + (f.note ? '<div class="note">'+f.note+'</div>' : '')
       + '</div></div>';
  });
  return h;
}

function render(){
  const ctabs = document.getElementById('ctabs');
  const holder = document.getElementById('sections');
  ctabs.innerHTML = '';
  holder.innerHTML = '';

  SECTIONS.forEach(function(s, si){
    const b = document.createElement('button');
    b.className = 'ctab' + (si===0 ? ' active' : '');
    b.textContent = s.label;
    b.setAttribute('data-c', s.id);
    ctabs.appendChild(b);

    const panel = document.createElement('div');
    panel.className = 'cpanel' + (si===0 ? ' active' : '');
    panel.id = s.id;

    const isAR = (s.id === 'ar');
    const list = s.data || [];
    let body = '<div class="filter-bar"><span class="fl">Difficulty</span>'
      + ['all','Easy','Medium','Hard'].map(function(f,fi){
          return '<button class="filter-btn'+(fi===0?' active':'')+'" data-t="'+s.id+'" data-f="'+f+'">'
               + (f==='all'?'All':f) + '</button>';
        }).join('') + '</div>';
    list.forEach(function(q, i){ body += cardHTML(q, i+1, isAR); });
    panel.innerHTML = body;
    holder.appendChild(panel);
  });

  const fpanel = document.createElement('div');
  fpanel.className = 'cpanel';
  fpanel.id = 'formulae';
  fpanel.innerHTML = formulaeHTML();
  const fbtn = document.createElement('button');
  fbtn.className = 'ctab';
  fbtn.textContent = 'Formulae';
  fbtn.setAttribute('data-c', 'formulae');
  ctabs.appendChild(fbtn);
  holder.appendChild(fpanel);

  wire();
  if(window.renderMathInElement){
    renderMathInElement(document.body,{delimiters:[{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false});
  }
}

function wire(){
  document.querySelectorAll('.ctab').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.ctab').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelectorAll('.cpanel').forEach(function(p){p.classList.remove('active');});
      document.getElementById(b.getAttribute('data-c')).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  document.querySelectorAll('.filter-btn').forEach(function(b){
    b.onclick = function(){
      const t = b.getAttribute('data-t'), f = b.getAttribute('data-f');
      document.querySelectorAll('.filter-btn[data-t="'+t+'"]').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.querySelectorAll('#'+t+' .qcard').forEach(function(card){
        card.style.display = (f==='all' || card.getAttribute('data-diff')===f) ? 'flex' : 'none';
      });
    };
  });
  document.querySelectorAll('.sol-toggle').forEach(function(b){
    b.onclick = function(){
      const box = b.parentNode.querySelector('.sol-box');
      box.classList.toggle('open');
      b.textContent = box.classList.contains('open') ? 'Hide Solution' : 'Show Solution';
    };
  });
  document.querySelectorAll('.mcq-opts').forEach(function(ul){
    ul.querySelectorAll('.mopt').forEach(function(li){
      li.onclick = function(){
        if(li.classList.contains('locked')) return;
        ul.querySelectorAll('.mopt').forEach(function(x){
          x.classList.add('locked');
          if(x.getAttribute('data-correct')==='1') x.classList.add('correct');
        });
        if(li.getAttribute('data-correct')!=='1') li.classList.add('wrong');
      };
    });
  });
  document.querySelectorAll('.rep-btn').forEach(function(b){
    b.onclick = function(){
      const card = b.closest('.qcard');
      const cp = card.closest('.cpanel');
      openReport({ tab: (cp ? cp.id.toUpperCase() : ''), qno: card.getAttribute('data-no') });
    };
  });
  document.querySelectorAll('.formula-header').forEach(function(hd){
    hd.onclick = function(){
      const body = hd.nextElementSibling;
      body.classList.toggle('open');
      hd.querySelector('.arrow').textContent = body.classList.contains('open') ? '–' : '+';
    };
  });
  document.getElementById('repCancel').onclick = function(){
    document.getElementById('repMask').classList.remove('open');
  };
  document.getElementById('repSend').onclick = sendReport;
}

let REP_CTX = {};
function openReport(ctx){
  REP_CTX = ctx;
  document.getElementById('repMeta').textContent =
    REPORT_META.board + ' · Class ' + REPORT_META.grade + ' · ' + REPORT_META.chapter
    + ' · ' + ctx.tab + ' · Q' + ctx.qno;
  document.getElementById('repText').value = '';
  document.getElementById('repMsg').textContent = '';
  document.getElementById('repMask').classList.add('open');
}
function sendReport(){
  const txt = document.getElementById('repText').value.trim();
  if(!txt){ document.getElementById('repMsg').textContent = 'Please describe the error.'; return; }
  const p = new URLSearchParams({
    board: REPORT_META.board, grade: REPORT_META.grade, chapter: REPORT_META.chapter,
    tab: REP_CTX.tab, qno: REP_CTX.qno, error: txt
  });
  function done(){ document.getElementById('repMsg').textContent = 'Sent. Thank you!'; }
  fetch(REPORT_ENDPOINT + '?' + p.toString(), {method:'GET', mode:'no-cors'})
    .then(done).catch(done);
  setTimeout(function(){ document.getElementById('repMask').classList.remove('open'); }, 900);
}

render();

</script>
</body>
</html>
