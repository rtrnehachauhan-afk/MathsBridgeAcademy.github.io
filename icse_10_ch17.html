<script>
/* ---------- low-level reveal helpers ---------- */
function revealArc(el, duration){
  duration = duration || 650;
  if(!el) return;
  let len; try{ len = el.getTotalLength(); } catch(e){ len = 200; }

  // SVG markers (arrowheads) render at a path's raw endpoint using its
  // actual geometry -- they ignore stroke-dasharray/stroke-dashoffset
  // entirely. Left alone, an arrowhead on a line being revealed this way
  // shows fully at the final tip from frame 1, before the shaft has drawn
  // in underneath it. Strip markers for the duration of the reveal and
  // restore them exactly when the stroke settles into its final state.
  // A caller (e.g. drawGroupAction's pre-hide pass) may already have
  // stripped the live attribute and stashed it on the dataset -- check
  // both so the marker is never lost.
  const markerStart = el.getAttribute('marker-start') || el.dataset.markerStart || null;
  const markerEnd = el.getAttribute('marker-end') || el.dataset.markerEnd || null;
  if(el.getAttribute('marker-start')) el.removeAttribute('marker-start');
  if(el.getAttribute('marker-end')) el.removeAttribute('marker-end');

  el.style.transition = 'none';
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
  el.getBoundingClientRect();
  el.style.transition = 'stroke-dashoffset ' + duration + 'ms ease-in-out';
  requestAnimationFrame(()=>{ el.style.strokeDashoffset = 0; });
  setTimeout(()=>{
    el.style.strokeDasharray=''; el.style.strokeDashoffset='';
    if(markerStart) el.setAttribute('marker-start', markerStart);
    if(markerEnd) el.setAttribute('marker-end', markerEnd);
    delete el.dataset.markerStart;
    delete el.dataset.markerEnd;
  }, duration + 40);
}
function revealFade(el, duration){
  duration = duration || 350;
  if(!el) return;
  el.style.transition = 'none';
  el.style.opacity = 0;
  el.getBoundingClientRect();
  el.style.transition = 'opacity ' + duration + 'ms ease-in';
  requestAnimationFrame(()=>{ el.style.opacity = 1; });
}
function fadeOut(el, duration){
  duration = duration || 400;
  if(!el) return;
  el.style.transition = 'none';
  el.style.opacity = 1;
  el.getBoundingClientRect();
  el.style.transition = 'opacity ' + duration + 'ms ease-out';
  requestAnimationFrame(()=>{ el.style.opacity = 0; });
}
function animateCompass(path, onDone, animDuration){
  if(!path){ if(onDone) onDone(); return; }
  const cx = parseFloat(path.dataset.cx), cy = parseFloat(path.dataset.cy);
  const genClass = 'gen-' + path.id;
  path.parentNode.querySelectorAll('.' + genClass).forEach(el => el.remove());

  let len; try{ len = path.getTotalLength(); } catch(e){ len = 200; }
  const svgNS = "http://www.w3.org/2000/svg";
  const parent = path.parentNode;

  const pivot = document.createElementNS(svgNS, "circle");
  pivot.setAttribute("cx", cx); pivot.setAttribute("cy", cy); pivot.setAttribute("r", 5.5);
  pivot.setAttribute("fill", "#2563eb"); pivot.setAttribute("stroke", "#fff"); pivot.setAttribute("stroke-width", "1.5");
  pivot.classList.add(genClass);
  pivot.style.opacity = 0; pivot.style.transition = "opacity .2s";
  parent.appendChild(pivot);

  const arm = document.createElementNS(svgNS, "line");
  arm.setAttribute("stroke", "#94a3b8"); arm.setAttribute("stroke-width", "1.5");
  arm.classList.add(genClass);
  arm.style.opacity = 0; arm.style.transition = "opacity .2s";
  parent.appendChild(arm);

  const pencil = document.createElementNS(svgNS, "circle");
  pencil.setAttribute("r", 5); pencil.setAttribute("fill", "#f59e0b");
  pencil.setAttribute("stroke", "#fff"); pencil.setAttribute("stroke-width", "1.5");
  pencil.classList.add(genClass);
  pencil.style.opacity = 0; pencil.style.transition = "opacity .2s";
  parent.appendChild(pencil);

  requestAnimationFrame(()=>{ pivot.style.opacity = 1; arm.style.opacity = 1; pencil.style.opacity = 1; });

  const duration = animDuration || 1000;
  const start = performance.now();
  function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t; }
  function frame(now){
    const raw = Math.min((now - start) / duration, 1);
    const eased = easeInOutQuad(raw);
    let pt; try{ pt = path.getPointAtLength(eased * len); } catch(e){ pt = {x:cx,y:cy}; }
    arm.setAttribute("x1", cx); arm.setAttribute("y1", cy);
    arm.setAttribute("x2", pt.x); arm.setAttribute("y2", pt.y);
    pencil.setAttribute("cx", pt.x); pencil.setAttribute("cy", pt.y);
    if (raw < 1){ requestAnimationFrame(frame); }
    else {
      setTimeout(()=>{
        arm.style.opacity = 0;
        pencil.style.opacity = 0;
        pivot.style.opacity = 0.55;
        if(onDone) onDone();
      }, 350);
    }
  }
  requestAnimationFrame(frame);
}
function revealArcC(el, duration){ revealArc(el, duration); animateCompass(el); }

function el(id){ return document.getElementById(id); }

function drawGroupAction(gid){
  const g = el(gid);
  g.style.transition = 'none';

  const compassEls = Array.from(g.querySelectorAll('.compass-arc, .compass-circle'));
  const plainStrokes = Array.from(g.querySelectorAll('line, path')).filter(p=> !p.classList.contains('compass-arc'));
  // Only elements the markup already marks opacity:0 are meant to be revealed
  // later (points, labels, measurements). Elements with no opacity:0 preset
  // (e.g. a centre dot + its letter label) are meant to appear the instant
  // the group appears, and must never be touched again.
  const others = Array.from(g.querySelectorAll('circle, text, rect, polygon'))
    .filter(o=> !o.classList.contains('compass-circle') && o.style.opacity === '0');

  // Pre-hide every element that will be animated in later -- compass arcs AND
  // plain lines/paths -- before the group becomes visible. Previously the
  // group's opacity flipped to 1 first, instantly exposing any child with no
  // opacity:0/dasharray override in its raw static state (e.g. a radius
  // line, or arcs after the first in a sequential chain). It then got yanked
  // invisible and redrawn once its own turn in the sequence arrived -- the
  // "fade, disappear, fade" glitch.
  compassEls.forEach(node=>{
    let len; try{ len = node.getTotalLength(); } catch(e){ len = 200; }
    node.style.transition = 'none';
    node.style.strokeDasharray = len;
    node.style.strokeDashoffset = len;
  });
  plainStrokes.forEach(node=>{
    let len; try{ len = node.getTotalLength(); } catch(e){ len = 300; }
    node.style.transition = 'none';
    node.style.strokeDasharray = len;
    node.style.strokeDashoffset = len;
    // Markers ignore stroke-dashoffset and render at the path's true
    // endpoint immediately -- strip them now and stash them so revealArc
    // can restore them only once the shaft has actually finished drawing.
    const ms = node.getAttribute('marker-start');
    const me = node.getAttribute('marker-end');
    if(ms){ node.dataset.markerStart = ms; node.removeAttribute('marker-start'); }
    if(me){ node.dataset.markerEnd = me; node.removeAttribute('marker-end'); }
  });

  g.style.opacity = 1;

  function fadeOthers(){
    others.forEach(o=>{
      o.style.transition = 'none'; o.style.opacity = 0; o.getBoundingClientRect();
      o.style.transition = 'opacity .5s ease-in';
    });
    requestAnimationFrame(()=>{ others.forEach(o=> o.style.opacity = 1); });
  }

  function revealPlainThenOthers(){
    plainStrokes.forEach(p=> revealArc(p, 850));
    if(plainStrokes.length > 0){
      setTimeout(fadeOthers, 850);
    } else {
      fadeOthers();
    }
  }

  function runCompassChain(i){
    if(i >= compassEls.length){ revealPlainThenOthers(); return; }
    const node = compassEls[i];
    const dur = 1000;
    revealArc(node, dur);
    animateCompass(node, ()=> runCompassChain(i+1), dur);
  }

  if(compassEls.length > 0){
    runCompassChain(0);
  } else {
    revealPlainThenOthers();
  }
}

function instantShowElement(node){
  node.style.transition = 'none';
  if(node.tagName === 'path' || node.tagName === 'line'){
    node.style.strokeDasharray = '';
    node.style.strokeDashoffset = '';
  } else {
    node.style.opacity = 1;
  }
}
function instantHideGroup(gid){
  const g = el(gid);
  g.style.transition = 'none';
  g.style.opacity = 0;
}
function instantHideElement(node){
  node.style.transition = 'none';
  if(node.tagName === 'path' || node.tagName === 'line'){
    let len; try{ len = node.getTotalLength(); } catch(e){ len = 300; }
    node.style.strokeDasharray = len;
    node.style.strokeDashoffset = len;
  } else {
    node.style.opacity = 0;
  }
}

    groups: ["q14_g1", "q14_g2", "q14_g3", "q14_g4", "q14_g5", "q14_g6", "q14_g7"],
    finalNote: "\u2705 By the hexagon's symmetry, the perpendicular distance from O to every side is identical to OM \u2014 so a single circle of radius OM, centred at O, touches all six sides at once, which is exactly what 'inscribed' requires.",
    microActions: [

  {

      "At F, construct \u2220EFA = 120\u00b0 the same way as at A and B (three arcs from ray FA) to get ray FE; open the compass to the same width as AB and, with F as centre, cut an arc on ray FE to mark E, so EF = 2.4 cm. Similarly at C, construct \u2220BCD = 120\u00b0 the same way (three arcs from ray CB) to get ray CD, and cut off CD = 2.4 cm on it with the same compass width.",
      "Join ED. ABCDEF is the required regular hexagon.",
      "Join the diagonals AD and BE. They intersect at O, the centre of the hexagon.",
      "From O, drop a perpendicular to side AB: with O as centre, draw an arc cutting AB at two points; with those two points as centres and equal radii (more than half the distance between them), draw two arcs intersecting on the side of AB away from O; join O to that intersection, cutting AB at M. OM is the apothem \u2014 the distance from the centre to the middle of a side.",

/* ---------- engine state ---------- */
let currentQ = 0;
let flatMicro = [];
let microPos = -1;
let animating = false;

function buildFlat(q){
  const flat = [];
  q.microActions.forEach((arr, mainIdx)=>{
    arr.forEach(a => flat.push({ mainIdx, ms:a.ms, fn:a.fn, ids:a.ids }));
  });
  return flat;
}

function lockControls(ms){
  animating = true;
  el("nextBtn").disabled = true;
  el("prevBtn").disabled = true;
  el("qPicker").disabled = true;
  document.querySelectorAll('.dot').forEach(d=> d.style.pointerEvents = 'none');
  setTimeout(()=>{
    animating = false;
    el("prevBtn").disabled = microPos <= 0;
    el("nextBtn").disabled = microPos >= flatMicro.length - 1;
    el("qPicker").disabled = false;
    document.querySelectorAll('.dot').forEach(d=> d.style.pointerEvents = 'auto');
  }, ms);
}

function updateUI(textChanged){
  const q = QUESTIONS[currentQ];
  const mi = flatMicro[microPos].mainIdx;

  if(textChanged){
    const wrap = el("stepTextWrap");
    wrap.classList.add("fading");
    setTimeout(()=>{
      el("stepTextNum").textContent = (mi+1) + ".";
      el("stepTextBody").textContent = q.stepLines[mi];
      wrap.classList.remove("fading");
    }, 220);
  }

  const isFinal = microPos === flatMicro.length - 1;
  const finalNote = el("finalNote");
  finalNote.style.display = isFinal ? "block" : "none";
  finalNote.textContent = q.finalNote;

  const prog = el("progress");
  prog.innerHTML = "";
  q.stepLines.forEach((s,i)=>{
    const d = document.createElement("div");
    d.className = "dot" + (i === mi ? " active" : "");
    d.onclick = ()=>{ if(animating) return; jumpToMainStep(i); };
    prog.appendChild(d);
  });

  el("prevBtn").disabled = microPos <= 0;
  el("nextBtn").disabled = microPos >= flatMicro.length - 1;
}

function goForward(){
  if(animating) return;
  if(microPos >= flatMicro.length - 1) return;
  const prevMain = microPos >= 0 ? flatMicro[microPos].mainIdx : -1;
  microPos++;
  const cur = flatMicro[microPos];
  cur.fn();
  updateUI(cur.mainIdx !== prevMain);
  lockControls(cur.ms || 700);
}

function applyStateInstant(targetPos){
  const q = QUESTIONS[currentQ];
  q.groups.forEach(gid=> instantHideGroup(gid));
  document.querySelectorAll('[class*="gen-"]').forEach(n=> n.remove());

  const neededGroups = new Set();
  for(let i = 0; i <= targetPos; i++) neededGroups.add(q.groups[flatMicro[i].mainIdx]);

  neededGroups.forEach(gid=>{
    const g = el(gid);
    g.style.transition = 'none';
    g.style.opacity = 1;
    g.querySelectorAll('path, line, circle, text, rect, polygon, g').forEach(n=>{
      n.style.transition = 'none';
      if(n.tagName === 'path' || n.tagName === 'line'){
        let len; try{ len = n.getTotalLength(); } catch(e){ len = 300; }
        n.style.strokeDasharray = len;
        n.style.strokeDashoffset = len;
      } else {
        n.style.opacity = 0;
      }
    });
  });

  for(let i = 0; i <= targetPos; i++){
    const action = flatMicro[i];
    if(action.ids === 'ALL'){
      const gid = q.groups[action.mainIdx];
      el(gid).querySelectorAll('path, line, circle, text, rect, polygon').forEach(n=> instantShowElement(n));
    } else {
      (action.ids || []).forEach(id=>{
        const hide = id.charAt(0) === '-';
        const n = el(hide ? id.slice(1) : id);
        if(n) (hide ? instantHideElement : instantShowElement)(n);
      });
    }
  }
  microPos = targetPos;
}

function goBack(){
  if(animating) return;
  if(microPos <= 0) return;
  const prevMain = flatMicro[microPos].mainIdx;
  applyStateInstant(microPos - 1);
  const newMain = flatMicro[microPos].mainIdx;
  updateUI(newMain !== prevMain);
  lockControls(300);
}

function jumpToMainStep(targetMainIdx){
  if(animating) return;
  let pos = -1;
  flatMicro.forEach((m,i)=>{ if(m.mainIdx === targetMainIdx) pos = i; });
  if(pos === -1) return;
  applyStateInstant(pos);
  updateUI(true);
  lockControls(300);
}

function renderInitial(){
  const q = QUESTIONS[currentQ];
  el("stepTextNum").textContent = "1.";
  el("stepTextBody").textContent = q.stepLines[0];
  el("finalNote").style.display = "none";

  const prog = el("progress");
  prog.innerHTML = "";
  q.stepLines.forEach((s,i)=>{
    const d = document.createElement("div");
    d.className = "dot";
    d.onclick = ()=>{ if(animating) return; jumpToMainStep(i); };
    prog.appendChild(d);
  });

  el("prevBtn").disabled = true;
  el("nextBtn").disabled = false;
}

function initQuestion(qi){
  currentQ = qi;
  flatMicro = buildFlat(QUESTIONS[qi]);
  QUESTIONS[qi].groups.forEach(gid=> instantHideGroup(gid));
  microPos = -1;
  el("qFullText").textContent = QUESTIONS[qi].question;
  renderInitial();
}

el("nextBtn").onclick = goForward;
el("prevBtn").onclick = goBack;

el("qPicker").onchange = (e)=>{
  if(animating) return;
  el(QUESTIONS[currentQ].svgId).style.display = 'none';
  const qi = parseInt(e.target.value, 10);
  el("qFullText").textContent = QUESTIONS[qi].question;
  el(QUESTIONS[qi].svgId).style.display = 'block';
  initQuestion(qi);
};

initQuestion(0);
</script>
